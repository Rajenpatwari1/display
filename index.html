    <script>
        tailwind.config = {
            theme: {

                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif'],

                    colors: {
                        'obsidian': '#030303',

    <style>
        /* ABSOLUTE 1-PAGE LOCK & HARDWARE ACCELERATION FOR SMART TVs */
        body, html {
            background-color: #0b0510; /* Deep space base */
            color: #ffffff;
            height: 100vh; height: 100dvh;
            width: 100vw;
            margin: 0; padding: 0;
            overflow: hidden; 
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* 🌟 ANIMATED PREMIUM MESH BACKGROUND 🌟 */
        .tv-bg {
            position: fixed; inset: 0; z-index: 0;
            background-color: #0b0510;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 0, 102, 0.35), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(102, 0, 255, 0.35), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(0, 229, 255, 0.3), transparent 50%),
                radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.2), transparent 40%);
            background-size: 150% 150%;
            animation: bgShift 20s ease-in-out infinite alternate;
            transform: translateZ(0);
        }

        @keyframes bgShift {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 100%; }
        }

        /* 🌟 FLOATING ANIMATIONS 🌟 */
        .float-animate-hero { animation: floatHero 8s ease-in-out infinite alternate; }
        .float-animate-list { animation: floatList 6s ease-in-out infinite alternate; }
        
        .mnc-row:nth-child(1) { animation-delay: 0s; }
        .mnc-row:nth-child(2) { animation-delay: -2s; }
        .mnc-row:nth-child(3) { animation-delay: -4s; }
        .mnc-row:nth-child(4) { animation-delay: -1s; }

        @keyframes floatHero { 0% { transform: translateY(0); } 100% { transform: translateY(-1.5vh); } }
        @keyframes floatList { 0% { transform: translateY(0); } 100% { transform: translateY(-1vh); } }

        /* ⚡ GAMING AESTHETIC: THUNDER & LIGHTNING BACKGROUND ⚡ */
        .storm-bg {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse at bottom, #090914 0%, #020205 100%);
        }
        
        /* ⚡ CYBER-GAMING GLASS PANELS ⚡ */
        .glass-card {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(4vh);
            -webkit-backdrop-filter: blur(4vh);
            border-top: 2px solid rgba(0, 229, 255, 0.3);
            border-left: 1px solid rgba(0, 229, 255, 0.1);
            border-right: 1px solid rgba(0, 229, 255, 0.1);
            border-bottom: 1px solid rgba(0, 229, 255, 0.05);
            box-shadow: 0 4vh 6vh rgba(0,0,0,0.8), inset 0 0 3vh rgba(0, 229, 255, 0.05);
            position: relative; overflow: hidden;
        }

        /* POSH TYPOGRAPHY SCALING */
        .hero-name { font-size: 4.5vh; line-height: 1.1; font-weight: 800; letter-spacing: 0.05em; text-shadow: 0 0 1.5vh rgba(0, 229, 255, 0.6); } 
        .hero-rev { font-size: 6.5vh; line-height: 1; font-weight: 800; letter-spacing: -0.02em; text-shadow: 0 0 2vh rgba(255, 255, 255, 0.5); } 
        
        .list-name { font-size: 3vh; line-height: 1.2; font-weight: 600; color: #ffffff; letter-spacing: 0.02em; }
        .list-rev { font-size: 3.8vh; line-height: 1; font-weight: 700; color: #ffffff; text-shadow: 0 0 1.5vh rgba(0, 229, 255, 0.4); }

        .currency-symbol { font-family: 'Outfit', sans-serif; font-weight: 400; opacity: 0.7; margin-right: 0.5vh; font-size: 0.8em; color: #00E5FF; }
        
        /* Hardware Accelerated Ultra-Crisp Avatars */
        .avatar-img { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            -webkit-transform: translateZ(0); 
            transform: translateZ(0);
            background-color: #000;
        }

        /* ⚡ GAMER WATERMARK RANKS ⚡ */
        .rank-watermark {
            -webkit-text-stroke: 2px rgba(0, 229, 255, 0.2);
            color: transparent;
            font-weight: 800;
            font-size: 7.5vh;
            text-shadow: 0 0 2vh rgba(0, 229, 255, 0.1);
        }

        /* ⚡ ELECTRIC LASER DATA LINE ⚡ */
        .progress-line-fill { 
            height: 100%; 
            transition: width 2s cubic-bezier(0.2, 0.8, 0.2, 1); 
            background: linear-gradient(90deg, #0044FF, #B500FF, #00E5FF, #FFFFFF);
            background-size: 300% 100%;
            animation: laserShift 2s linear infinite;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 2vh rgba(0, 229, 255, 0.8), 0 0 1vh #FFFFFF;
        }

        @keyframes laserShift { 0% { background-position: 100% 0; } 100% { background-position: -50% 0; } }

        /* Smooth Corporate Animations */
        @keyframes tvFadeSlide { 0% { opacity: 0; transform: translateX(2vw) scale(0.98); } 100% { opacity: 1; transform: translateX(0) scale(1); } }
        @keyframes tvSmoothScale { 0% { opacity: 0; transform: scale(0.92); } 100% { opacity: 1; transform: scale(1); } }
        .animate-tv-slide { animation: tvFadeSlide 1.2s cubic-bezier(0.16, 1, 0.3, 1) backwards; will-change: transform, opacity; }
        .animate-tv-pop { animation: tvSmoothScale 1.5s cubic-bezier(0.16, 1, 0.3, 1) backwards; will-change: transform, opacity; }
        
        /* 🚀 TOP-NOTCH 360-DEGREE ORBITAL CARTOON ANIMATION 🚀 */
        .mascot-orbit-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            z-index: 100;
            pointer-events: none; /* TV Safety: Cannot be clicked */
        }

        .mascot-orbit-spinner {
            position: absolute;
            top: 0;
            left: 0;
            /* Container spins in a massive circle around the avatar */
            animation: spinCircle 12s linear infinite; 
            will-change: transform;
        }

        .mascot-cartoon-img {
            position: absolute;
            /* Center the cartoon exactly on the orbit line */
            top: -7.5vh; 
            left: -7.5vh; 
            width: 15vh; 
            height: 15vh;
            object-fit: contain;
            transform-origin: center;
            filter: drop-shadow(0 2vh 2vh rgba(0,0,0,0.8));
            /* 1. Push it out 26vh to make a huge circle. 2. Counter-rotate so it stays upright. 3. Make it bounce! */
            animation: counterSpinCircle 12s linear infinite, characterGroove 0.5s ease-in-out infinite alternate;
            will-change: transform, margin-top;
        }

        @keyframes spinCircle {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes counterSpinCircle {
            /* Pushes character out to the edge of the photo, then spins backwards to stay perfectly upright! */
            0% { transform: translateY(-27vh) rotate(0deg); }
            100% { transform: translateY(-27vh) rotate(-360deg); }
        }

        @keyframes characterGroove {
            0% { margin-top: 0; }
            100% { margin-top: -2.5vh; }
        }
    </style>
</head>

    <script>
        // Clock
        setInterval(() => {
            try {
                // TV Fix: 12-hour AM/PM format with seconds
                document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('en-US', { hour12: true, hour: 'numeric', minute: '2-digit', second: '2-digit' });
            } catch (e) {
                // Bulletproof manual fallback for older TVs
                let d = new Date();
                let h = d.getHours();
                let m = d.getMinutes().toString().padStart(2, '0');
                let s = d.getSeconds().toString().padStart(2, '0');
                let ampm = h >= 12 ? 'PM' : 'AM';
                document.getElementById('live-clock').innerText = (h % 12 || 12) + ":" + m + ":" + s + " " + ampm;
            }
        }, 1000);

        // TV STABILITY ENGINE: Auto-Refresh Page every 5 minutes to clean TV RAM completely & avoid OS Crashes
        const TV_AUTO_RELOAD_MINUTES = 5;

        // TV KEEP-ALIVE AUDIO HEARTBEAT (Prevents TV OS from auto-closing browser)
        function initTvKeepAlive() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                // Silent heartbeat tone every 25 seconds
                setInterval(() => {
                    if (ctx.state === 'suspended') ctx.resume();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    gain.gain.value = 0.0001; // Inaudible
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                }, 25000);
            } catch (e) {
                console.log("Audio Heartbeat not supported, fallback active");
            }
        }

        const SHEET_ID = '1zm49yxiWzi8LCrazWa7VMTNQO0f5qPRmY3Sf0ILVyQw';

        window.addEventListener('unhandledrejection', function(event) {

                loader.innerHTML = `<div style="color:#ff3333; font-size:3vh; text-align:center; padding:4vh; background:#000; border:2px solid #ff3333; border-radius:2vh; z-index:9999;"><b>TV NETWORK BLOCKED:</b><br>${event.reason}</div>`;
            }
        });

        // Robust CSV Parser
        function parseCSV(text) {
            const result = []; let row = []; let inQuotes = false; let currentValue = "";
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    if (inQuotes && text[i+1] === '"') { currentValue += '"'; i++; } 
                    else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) {
                    row.push(currentValue); currentValue = "";
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && text[i+1] === '\n') i++; 
                    row.push(currentValue); result.push(row); row = []; currentValue = "";
                } else { currentValue += char; }
            }
            if (currentValue || row.length > 0) { row.push(currentValue); result.push(row); }
            return result;
        }

        function formatRupees(num) {
            let formatted = "0";
            try {
                // TV Fix: Strictly enforce Indian Locale for correct 6,12,155 formatting
                formatted = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 }).format(num);
            } catch(e) {
                // Bulletproof mathematical fallback for the exact Indian numbering system on old TVs
                let str = Math.floor(num).toString();
                let lastThree = str.substring(str.length - 3);
                let otherNumbers = str.substring(0, str.length - 3);
                if (otherNumbers != '') { lastThree = ',' + lastThree; }
                formatted = otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + lastThree;
            }
            return `<span class="currency-symbol text-white/50">₹</span>${formatted}`;
        }

        function animateValue(element, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!document.contains(element)) return; 
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 5); 
                const currentVal = Math.floor(easeOut * (end - start) + start);
                element.innerHTML = formatRupees(currentVal);
                if (progress < 1) window.requestAnimationFrame(step);
                else element.innerHTML = formatRupees(end); 
            };
            window.requestAnimationFrame(step);
        }

                : `<div class="w-full h-full rounded-full bg-[#050505] flex items-center justify-center text-[#00E5FF]/30 text-[6vh] font-sans font-black">${initial}</div>`;

            const tlFirst = employee.tl.split(/\s+/)[0] || 'N/A';
            const rmFirst = employee.rm.split(/\s+/)[0] || 'N/A';
            
            let listTagsHtml = "";
            if (employee.tl.toLowerCase() !== employee.name.toLowerCase() && employee.tl.toLowerCase() !== employee.rm.toLowerCase() && tlFirst !== 'N/A') {
                listTagsHtml += `<span class="bg-[#B500FF]/10 px-[1.2vh] py-[0.3vh] rounded-sm text-white/90 font-bold tracking-widest border border-[#B500FF]/30 shadow-[0_0_1vh_rgba(181,0,255,0.2)]"><span class="text-[#B500FF] mr-[0.5vh]">TL</span>${tlFirst}</span>`;
            }
            if (rmFirst !== 'N/A') {
                listTagsHtml += `<span class="bg-[#00E5FF]/10 px-[1.2vh] py-[0.3vh] rounded-sm text-white/90 font-bold tracking-widest border border-[#00E5FF]/30 shadow-[0_0_1vh_rgba(0,229,255,0.2)]"><span class="text-[#00E5FF] mr-[0.5vh]">MGR</span>${rmFirst}</span>`;
            }
                
            const fillPercentage = Math.max(2, (employee.sales / maxSalesBenchmark) * 100);

            return `
                <div class="flex-1 w-full mnc-row glass-card flex flex-col justify-center animate-tv-slide float-animate-list rounded-[1.5vh] px-[3vh]">
                    
                    <div class="flex items-center justify-between w-full h-full relative z-10 py-[1.5vh]">
                        
                        <div class="flex items-center gap-[2vh] min-w-0 flex-1">
                            
                            <!-- ELECTRIC WATERMARK NUMBER (Fixed Width to prevent overlap) -->
                            <div class="font-mono w-[10vh] shrink-0 text-center rank-watermark">0${rank}</div>
                            
                            <!-- LIST AVATAR (16vh - Perfectly Aligned) -->
                            <div class="w-[16vh] h-[16vh] rounded-full p-[0.4vh] shrink-0 bg-[#00E5FF]/20 border border-[#00E5FF]/40 shadow-[0_0_2vh_rgba(0,229,255,0.3)] flex items-center justify-center">
                                <div class="w-full h-full rounded-full overflow-hidden bg-[#000] flex items-center justify-center">
                                    ${photoHtml}
                                </div>
                            </div>
                            
                            <div class="flex flex-col min-w-0 px-[2vh] gap-[1vh] flex-1 justify-center">
                                <h3 class="font-sans list-name truncate drop-shadow-[0_0_1vh_rgba(0,229,255,0.5)]">${employee.name}</h3>
                                <div class="font-sans text-[1.2vh] uppercase flex items-center flex-wrap gap-[1vh]">
                                    ${listTagsHtml}
                                </div>
                            </div>
                        </div>

                        <!-- Crisp Gaming Revenue -->
                        <div class="flex flex-col items-end justify-center shrink-0 pl-[2vh]">
                            <div class="font-mono list-rev numeric-counter drop-shadow-[0_0_2vh_rgba(0,229,255,0.6)]" data-target-value="${employee.sales}">
                                <span class="currency-symbol">₹</span>0
                            </div>
                        </div>
                    </div>

                    <!-- ⚡ CYBER LASER DATA TRACK ⚡ -->
                    <div class="absolute bottom-0 left-0 right-0 h-[5px] bg-black/60 border-t border-[#00E5FF]/10">
                        <div class="progress-line-fill" style="width: 0%;" data-target-width="${fillPercentage}%"></div>
                    </div>
                </div>
            `;
        }

        // TV-SAFE NETWORK FETCHER: Replaces modern 'fetch' with ultra-compatible XMLHttpRequest for older TV Browsers
        function fetchSafe(url) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onload = () => resolve({ ok: xhr.status === 200, text: () => Promise.resolve(xhr.responseText) });
                xhr.onerror = () => reject(new Error("TV blocked connection (Check if Sheet is Public)"));
                xhr.timeout = 10000;
                xhr.ontimeout = () => reject(new Error("TV Network Timeout. Wi-Fi too slow."));
                xhr.send();
            });
        }

        async function fetchAndMergeData() {
            const cb = Date.now();
            const photosUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME_PHOTOS)}&z=${cb}`;
            const salesUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME_SALES)}&z=${cb}`;

            try {
                // Using the TV-Safe XHR fallback instead of modern fetch
                const [photosRes, salesRes] = await Promise.all([ fetchSafe(photosUrl), fetchSafe(salesUrl) ]);
                
                if (!photosRes.ok || !salesRes.ok) throw new Error("Google denied access. Sheet MUST be set to 'Anyone with the link'.");

                const photosRaw = parseCSV(await photosRes.text());
                const salesRaw = parseCSV(await salesRes.text());

                const exactPhotoMap = new Map();
                const firstNamePhotoMap = new Map();
                
                photosRaw.forEach(row => {
                    if (row.length >= 7) {
                        const fullName = (row[0] || '').trim().toLowerCase();
                        const photoUrl = (row[6] || '').trim();
                        if (fullName && photoUrl) {
                            let cleanUrl = photoUrl;
                            const driveMatch = photoUrl.match(/(?:\/d\/|id=)([\w-]+)/);
                            // HIGH-RES UPGRADE: Requesting sz=s2048-c (2048px Square Crop) for crystal clear Ultra-HD TV avatars
                            if (driveMatch && driveMatch[1]) cleanUrl = `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=s2048-c`;
                            
                            exactPhotoMap.set(fullName, cleanUrl);
                            const firstName = fullName.split(/\s+/)[0]; 
                            if (firstName && !firstNamePhotoMap.has(firstName)) firstNamePhotoMap.set(firstName, cleanUrl);
                        }
                    }
                });

                const mergedData = [];
                
                salesRaw.forEach((row) => {
                    const name = (row[0] || '').toString().trim();
                    const rawSalesStr = (row[1] || '').toString().trim(); 
                    const tl = (row[2] || '').toString().trim() || 'N/A'; 
                    const rm = (row[3] || '').toString().trim() || 'N/A'; 

                    let cleanSalesStr = rawSalesStr.replace(/[^0-9.-]+/g, "");
                    const achieved = parseFloat(cleanSalesStr);
                    
                    if (name && !isNaN(achieved) && name.toLowerCase() !== 'employee name') {
                        const searchNameLower = name.toLowerCase();
                        const searchFirstName = searchNameLower.split(/\s+/)[0];
                        const matchedPhoto = exactPhotoMap.get(searchNameLower) || firstNamePhotoMap.get(searchFirstName) || null;
                        
                        mergedData.push({ name, sales: achieved, tl, rm, photo: matchedPhoto });
                    }
                });

                mergedData.sort((a, b) => b.sales - a.sales);
                return mergedData.slice(0, 5);

            } catch (error) {
                console.error("Sync Error:", error);
                throw error;
            }
        }

        function renderLeaderboard(data) {
            if (!data || data.length === 0) return;

            const newDataHash = JSON.stringify(data);
            if (newDataHash === previousDataHash) return; 
            previousDataHash = newDataHash;
            
            maxSalesBenchmark = data[0].sales;

            const heroSlot = document.getElementById('hero-slot');
            const contendersSlot = document.getElementById('contenders-slot');

            heroSlot.innerHTML = ''; 
            contendersSlot.innerHTML = '';

            if (data[0]) heroSlot.innerHTML = buildHeroCard(data[0]);
            
            for (let i = 1; i < 5; i++) {
                if (data[i]) contendersSlot.innerHTML += buildListCard(data[i], i + 1);
            }

            // Staggered Animations
            setTimeout(() => {
                document.querySelectorAll('.numeric-counter').forEach(counter => {
                    const targetValue = parseFloat(counter.getAttribute('data-target-value'));
                    animateValue(counter, 0, targetValue, 2500); 
                });

                document.querySelectorAll('.progress-line-fill').forEach((bar, index) => {
                    setTimeout(() => { bar.style.width = bar.getAttribute('data-target-width'); }, 300 + (index * 150));
                });
            }, 100);

            if (!loader.classList.contains('hidden')) {
                loader.classList.add('opacity-0');
                setTimeout(() => { loader.classList.add('hidden'); }, 500);
            }
        }

        async function updateDashboard() {
            try { 
                renderLeaderboard(await fetchAndMergeData()); 
            } 
            catch (err) { 
                console.warn("Sync Issue:", err.message); 
                const loader = document.getElementById('loader');
                if(loader) {
                    loader.classList.remove('opacity-0', 'hidden');
                    loader.innerHTML = `<div style="color:#ff3333; font-size:3vh; text-align:center; padding:4vh; background:#000; border:2px solid #ff3333; border-radius:2vh; z-index:9999;"><b>TV DATA BLOCKED:</b><br>The TV browser is refusing to download the Google Sheet.<br>Error: ${err.message}</div>`;
                }
            }
        }

        // Screen Wake Lock API to prevent TV/Laptop from sleeping
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log("Wake Lock ignored by browser:", err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateDashboard();
            setInterval(updateDashboard, REFRESH_INTERVAL_MS);
            
            // 1. ATTEMPT AUTOMATIC FULLSCREEN & KEEP-ALIVE (For Digital Signage TVs)
            setTimeout(() => {
                // Try to force Wake Lock and Heartbeat immediately
                requestWakeLock();
                initTvKeepAlive();
                
                // Try to force Fullscreen without a click
                try {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().then(() => {
                            const fsBtn = document.getElementById('fullscreen-btn');
                            if(fsBtn) fsBtn.classList.add('text-white', 'bg-white/10');
                        }).catch((err) => {
                            console.warn("Auto-fullscreen blocked by TV security. TV requires Kiosk mode or one initial click.", err.message);
                        });
                    }
                } catch(e) {}
            }, 2500); // 2.5 second delay allows the TV OS to finish loading the browser first

            // Keep TV screen active if it switches tabs and comes back
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') requestWakeLock();
            });

            // 2. FALLBACK: Re-acquire wake lock and trigger FULLSCREEN on first remote click anywhere (if auto fails)
            document.body.addEventListener('click', () => {
                requestWakeLock();
                initTvKeepAlive();
                
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                    const fsBtn = document.getElementById('fullscreen-btn');
                    if(fsBtn) fsBtn.classList.add('text-white', 'bg-white/10');
                }
            });

            const fullscreenBtn = document.getElementById('fullscreen-btn');
            fullscreenBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent double-triggering with body click
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                    fullscreenBtn.classList.add('text-white', 'bg-white/10');
                } else {
                    document.exitFullscreen();
                    fullscreenBtn.classList.remove('text-white', 'bg-white/10');
                }
            });
        });
    </script>
</body>
