<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- HARDWARE-LEVEL TV AUTO-REFRESH: Forces browser to reload every 300 seconds (5 mins) natively -->
    <meta http-equiv="refresh" content="300">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['"Outfit"', 'sans-serif'],
                        'mono': ['"Space Grotesk"', 'monospace'],
                    },
                    colors: {
                        'fin-dark': '#030508',       
                        'fin-panel': '#0A0F1A',      
                        'fin-cyan': '#00F0FF',       
                        'fin-gold': '#FFD700',

    <style>
        body, html {
            background-color: #030508;
            color: #ffffff;
            height: 100vh; height: 100dvh;
            width: 100vw;
            margin: 0; padding: 0;
            overflow: hidden; 
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Cyber Background Animations */
        @keyframes aurora-1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-5vw, 5vh) scale(1.1); } }
        @keyframes aurora-2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(5vw, -5vh) scale(1.15); } }

        .fin-card {
            background: linear-gradient(145deg, rgba(10, 15, 26, 0.7) 0%, rgba(5, 8, 15, 0.9) 100%);
            backdrop-filter: blur(2vh); -webkit-backdrop-filter: blur(2vh);
            border: 1px solid rgba(0, 240, 255, 0.1);
            border-top: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 2.5vh;
            box-shadow: 0 2.5vh 5vh rgba(0,0,0,0.8), inset 0 1vh 2vh rgba(0, 240, 255, 0.03);
        }

        .hero-card {
            border-top: 0.6vh solid #FFD700;
            background: linear-gradient(180deg, rgba(255, 215, 0, 0.08) 0%, rgba(5, 8, 15, 0.9) 100%);
            box-shadow: 0 3vh 6vh rgba(0,0,0,0.9), 0 0 8vh rgba(255,215,0,0.1), inset 0 1vh 4vh rgba(255,215,0,0.05);
        }

        .list-row {
            background: linear-gradient(90deg, rgba(10, 15, 26, 0.6) 0%, rgba(5, 8, 15, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 2vh;
            position: relative; overflow: hidden;
            backdrop-filter: blur(1.5vh); -webkit-backdrop-filter: blur(1.5vh);
            display: flex; align-items: center;
        }

        .volume-track { position: absolute; bottom: 0; left: 0; right: 0; height: 0.4vh; background: rgba(255,255,255,0.03); }
        .volume-fill { height: 100%; transition: width 1.5s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 0 1.5vh currentColor; }

        /* Typography */
        .header-title { font-size: 4.5vh; letter-spacing: 0.15em; font-weight: 900; line-height: 1; }
        .hero-name { font-size: 4.5vh; line-height: 1.1; font-weight: 800; letter-spacing: 0.02em; }
        .hero-rev { font-size: 6vh; line-height: 1; font-weight: 900; }
        
        .list-name { font-size: 3.5vh; line-height: 1.2; font-weight: 700; }
        .list-rev { font-size: 4.5vh; line-height: 1; font-weight: 700; }

        .currency-symbol { font-weight: 400; opacity: 0.6; margin-right: 0.5vh; font-size: 0.8em; }
        
        /* 
         * AVATAR STYLING:
         * Changed from rounded-full (circles) to rounded-[3vh] (squircles) 
         * This PREVENTS the original photo from being heavily cut off on the sides.
         */
        .avatar-img { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            object-position: top center;
            border-radius: 2.5vh; 
        }

        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(2vh); } 100% { opacity: 1; transform: translateY(0); } }
        .anim-fade-up { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards; }

        @keyframes tickerScroll { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        .animate-ticker { animation: tickerScroll 25s linear infinite; will-change: transform; white-space: nowrap; }
        
        @keyframes shimmer-sweep { 0% { transform: translateX(-150%) skewX(-20deg); } 100% { transform: translateX(200%) skewX(-20deg); } }
        @keyframes float-badge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1vh); } }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
        
        /* Creative Target Achievement Glow integrated into Revenue */
        .target-glow {
            box-shadow: 0 0 2vh rgba(255, 215, 0, 0.3), inset 0 0 1vh rgba(255, 215, 0, 0.1);
            animation: breathe-gold 3s ease-in-out infinite alternate;
        }
        @keyframes breathe-gold {
            0% { box-shadow: 0 0 1vh rgba(255, 215, 0, 0.2), inset 0 0 0.5vh rgba(255, 215, 0, 0.1); border-color: rgba(255, 215, 0, 0.3); }
            100% { box-shadow: 0 0 3vh rgba(255, 215, 0, 0.5), inset 0 0 1.5vh rgba(255, 215, 0, 0.3); border-color: rgba(255, 215, 0, 0.8); }
        }
        
        /* Holographic scanning line for revenue panel */
        @keyframes scan-line { 0% { left: -10%; opacity: 0; } 50% { opacity: 1; } 100% { left: 110%; opacity: 0; } }
        .animate-scan {
            position: absolute; top: 0; bottom: 0; width: 2vh;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: skewX(-20deg);
            animation: scan-line 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
    </style>
</head>

    <script>
        setInterval(() => {
            const now = new Date();
            try {
                document.getElementById('live-clock').innerText = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                const options = { weekday: 'short', month: 'short', day: 'numeric' };
                document.getElementById('live-date').innerText = now.toLocaleDateString('en-US', options);

                const month = now.toLocaleString('en-US', { month: 'long' }).toUpperCase();
                const year = now.getFullYear();
                const date = now.getDate();
                
                const headerMonth = document.getElementById('header-month');
                if (headerMonth && headerMonth.dataset.month !== month) {
                    headerMonth.innerText = `${month} ${year}`;
                    headerMonth.dataset.month = month;
                }

                let ordinal = "TH";
                if (date > 3 && date < 21) ordinal = "TH";
                else {
                    const lastDigit = date % 10;
                    if(lastDigit === 1) ordinal = "ST";
                    else if(lastDigit === 2) ordinal = "ND";
                    else if(lastDigit === 3) ordinal = "RD";
                }

                const ticker = document.getElementById('footer-ticker');
                if (ticker && ticker.dataset.updatedForDay != date) {
                    const dateStr = `LIVE DATA AS OF ${month} ${date}${ordinal}`;
                    const repeatingText = `
                        <span class="flex items-center gap-[1.5vh]"><span class="text-[#00F0FF]">■</span> ${dateStr}</span>
                        <span class="text-white/30">|</span>
                        <span class="flex items-center gap-[1.5vh] text-[#E2E8F0] tracking-[0.2em] font-bold">ENTERPRISE SALES LEADERBOARD</span>
                        <span class="text-white/30">|</span>
                    `;
                    ticker.innerHTML = repeatingText.repeat(8);
                    ticker.dataset.updatedForDay = date; 
                }
            } catch (e) {
                document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
            }
        }, 1000);

        const TV_AUTO_RELOAD_MINUTES = 5;
        setTimeout(() => { window.location.reload(); }, TV_AUTO_RELOAD_MINUTES * 60 * 1000);

        function initTvKeepAlive() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                setInterval(() => {
                    if (ctx.state === 'suspended') ctx.resume();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    gain.gain.value = 0.0001;
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                }, 25000);
            } catch (e) { console.log("Audio Heartbeat not supported"); }
        }

        const SHEET_ID = '1zm49yxiWzi8LCrazWa7VMTNQO0f5qPRmY3Sf0ILVyQw';
        const SHEET_NAME_PHOTOS = 'Employee Photo';
        const SHEET_NAME_SALES = 'Sheet2';
        const REFRESH_INTERVAL_MS = 20000;
        let previousDataHash = "";
        let maxSalesBenchmark = 1; 
        const loader = document.getElementById('loader');

        window.onerror = function(msg, url, line) {
            if(loader) {
                loader.classList.remove('opacity-0', 'hidden');
                loader.innerHTML = `<div style="color:#ff3333; font-family:monospace; text-align:center; padding:4vh; background:#000;">SYS_ERR: ${msg} (Line ${line})</div>`;
            }
        };

        function parseCSV(text) {
            const result = []; let row = []; let inQuotes = false; let currentValue = "";
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    if (inQuotes && text[i+1] === '"') { currentValue += '"'; i++; } 
                    else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) {
                    row.push(currentValue); currentValue = "";
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && text[i+1] === '\n') i++; 
                    row.push(currentValue); result.push(row); row = []; currentValue = "";
                } else { currentValue += char; }
            }
            if (currentValue || row.length > 0) { row.push(currentValue); result.push(row); }
            return result;
        }

        function formatRupees(num) {
            let formatted = "0";
            try { formatted = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 }).format(num); } 
            catch(e) { formatted = Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
            return `<span class="currency-symbol">₹</span>${formatted}`;
        }

        function animateValue(element, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!document.contains(element)) return; 
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 5); 
                const currentVal = Math.floor(easeOut * (end - start) + start);
                element.innerHTML = formatRupees(currentVal);
                if (progress < 1) window.requestAnimationFrame(step);
                else element.innerHTML = formatRupees(end); 
            };
            window.requestAnimationFrame(step);
        }

        // FINANCIAL HERO CARD (Rank 1 - Elite Performer)
        function buildHeroCard(employee) {
            const initial = employee.name.charAt(0).toUpperCase();
            
            // MASSIVE Avatar - Square with rounded edges (squircle) to preserve raw image format
            // Outer container w-[38vh], Image w-[34vh]

                ? `<img src="${employee.photo}" class="avatar-img shadow-[inset_0_0_4vh_rgba(255,215,0,0.3)]" onerror="this.onerror=null; this.outerHTML='<div class=&quot;w-full h-full bg-gradient-to-br from-[#FFD700]/20 to-[#1A2333] rounded-[2.5vh] flex items-center justify-center text-[#FFD700]/50 text-[14vh] font-sans font-medium&quot;>${initial}</div>';">`
                : `<div class="w-full h-full bg-gradient-to-br from-[#FFD700]/20 to-[#1A2333] rounded-[2.5vh] flex items-center justify-center text-[#FFD700]/50 text-[14vh] font-sans font-medium">${initial}</div>`;

            const tlFirst = employee.tl.split(/\s+/)[0] || 'N/A';
            const rmFirst = employee.rm.split(/\s+/)[0] || 'N/A';
            
            let tagsHtml = "";
            if (employee.tl.toLowerCase() !== employee.name.toLowerCase() && employee.tl.toLowerCase() !== employee.rm.toLowerCase() && tlFirst !== 'N/A') {

            }
            if (rmFirst !== 'N/A') {
                tagsHtml += `<div class="bg-[#05080F]/80 border border-[#00F0FF]/40 px-[2.5vh] py-[0.8vh] rounded-md text-[#00F0FF]/90 tracking-widest text-[1.6vh] shadow-[0_0_1vh_rgba(0,240,255,0.15)] whitespace-nowrap"><span class="opacity-60">MGR:</span> <span class="text-white ml-[0.3vh] font-bold">${rmFirst}</span></div>`;
            }

            return `
                <div class="w-full h-full flex flex-col items-center justify-between text-center relative z-10 w-full">
                    
                    <!-- TOP PERFORMER BADGE -->
                    <div class="w-full flex justify-center items-center relative z-30 shrink-0">
                        <div class="absolute w-[35vh] h-[4vh] bg-[#FFD700] blur-[2.5vh] opacity-40 animate-pulse"></div>
                        <div class="relative bg-gradient-to-r from-[#FFD700]/90 via-[#FFF8DC] to-[#FFD700]/90 backdrop-blur-xl border-[0.3vh] border-[#FFD700] px-[4vh] py-[1vh] rounded-full flex items-center gap-[1.5vh] shadow-[0_1vh_3vh_rgba(255,215,0,0.5),_inset_0_0_1.5vh_rgba(255,255,255,0.9)] overflow-hidden animate-[float-badge_4s_ease-in-out_infinite]">
                            <div class="absolute inset-0 w-[200%] bg-gradient-to-r from-transparent via-[#FFFFFF]/80 to-transparent animate-[shimmer-sweep_2.5s_infinite]"></div>
                            <span class="text-[2.5vh] relative z-10 drop-shadow-[0_0_1vh_rgba(255,215,0,1)]">⭐</span>
                            <span class="relative z-10 font-sans font-black text-[#030508] text-[2.5vh] tracking-[0.2em] uppercase drop-shadow-[0_0.1vh_0.2vh_rgba(255,255,255,0.8)] whitespace-nowrap">
                                TOP PERFORMER
                            </span>
                            <span class="text-[2.5vh] relative z-10 drop-shadow-[0_0_1vh_rgba(255,215,0,1)]">⭐</span>
                        </div>
                    </div>

                    <!-- MASSIVE LUXURY AVATAR (Changed to rounded square to show more raw photo) -->
                    <div class="relative w-[38vh] h-[38vh] shrink-0 flex items-center justify-center animate-[float-badge_6s_ease-in-out_infinite_0.5s] my-[2vh]">
                        <div class="absolute inset-[0vh] bg-[#FFD700] blur-[4vh] opacity-30 rounded-[3vh]"></div>
                        
                        <!-- Tech Orbits (Adjusted to squircle shape via border-radius) -->
                        <div class="absolute rounded-[4vh] border-[0.3vh] border-dashed border-[#FFD700]/50" style="inset: -1.5vh;"></div>
                        
                        <!-- The Avatar Core -->
                        <div class="w-[34vh] h-[34vh] bg-[#030508] rounded-[2.5vh] overflow-hidden relative z-10 border-[0.6vh] border-[#FFD700] shadow-[0_2vh_4vh_rgba(0,0,0,0.9),_inset_0_0_2vh_rgba(255,215,0,0.4)] flex items-center justify-center m-0 p-0">
                            ${photoHtml}
                        </div>
                    </div>

                    <!-- AMPLIFIED NAME & TAGS -->
                    <div class="flex flex-col items-center justify-center w-full shrink-0">
                        <h2 class="font-sans hero-name text-transparent bg-clip-text bg-gradient-to-b from-white via-white to-[#FFD700] font-black uppercase tracking-widest leading-tight px-[1vh] drop-shadow-[0_0.5vh_1vh_rgba(255,215,0,0.4)] line-clamp-2">
                            ${employee.name}
                        </h2>
                        <div class="font-mono flex items-center justify-center gap-[2vh] mt-[1.5vh] w-full flex-wrap px-[1vh]">
                            ${tagsHtml}
                        </div>
                    </div>

                    <!-- CREATIVE REVENUE PANEL (Fixed clipping, pushed to bottom) -->
                    <div class="w-full shrink-0 flex flex-col justify-end mt-auto pt-[2vh]">
                        <!-- Combining the glowing target border and the scanning line directly into the Revenue box to save vertical space while adding creativity -->
                        <div class="target-glow w-full shrink-0 bg-gradient-to-r from-[#0A1224] via-[#050810] to-[#0A1224] backdrop-blur-3xl py-[2.5vh] px-[3.5vh] rounded-[1.5vh] border-[0.3vh] flex items-center justify-between relative overflow-hidden">
                            <div class="animate-scan"></div>
                            
                            <div class="flex flex-col items-start z-10 shrink-0 text-left w-[12vh]">
                                <span class="font-mono text-[1.4vh] text-[#FFD700]/80 tracking-[0.2em] uppercase font-bold leading-tight mb-[0.2vh]">TOTAL</span>
                                <span class="font-mono text-[2vh] text-white tracking-[0.15em] uppercase font-bold leading-tight">REVENUE</span>
                            </div>
                            
                            <!-- Guaranteed visible revenue text -->
                            <div class="flex items-baseline justify-end flex-1 whitespace-nowrap pl-[1vh] z-10 min-w-0">
                                <span class="font-mono hero-rev numeric-counter text-white font-black leading-none drop-shadow-[0_0_2vh_rgba(255,215,0,0.4)] flex items-baseline truncate" data-target-value="${employee.sales}">
                                    <span class="currency-symbol text-[#FFD700] font-normal mr-[0.5vh]">₹</span><span>0</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // FINANCIAL LIST CARD (Strict Row Alignment & Sizing)
        function buildListCard(employee, rank) {
            const initial = employee.name.charAt(0).toUpperCase();
            
            let rankColor, glowColor, borderGlow;
            if (rank === 2) { rankColor = "#00F0FF"; glowColor = "rgba(0, 240, 255, 0.7)"; borderGlow = "border-[#00F0FF]/40"; }      
            else if (rank === 3) { rankColor = "#FF8A65"; glowColor = "rgba(255, 138, 101, 0.7)"; borderGlow = "border-[#FF8A65]/40"; }   
            else { rankColor = "#4A90E2"; glowColor = "rgba(74, 144, 226, 0.6)"; borderGlow = "border-[#4A90E2]/30"; }                   

            // Substantially Increased Avatar Size (w-[14vh] h-[14vh]) for Ranks 2-5
            // Using rounded-[2vh] squircle to show more raw body/shoulders
            const photoHtml = employee.photo 
                ? `<img src="${employee.photo}" class="avatar-img" style="border-radius: 1.5vh;" onerror="this.onerror=null; this.outerHTML='<div class=&quot;w-full h-full bg-[#0A1224] flex items-center justify-center text-white/40 text-[5vh] font-sans font-bold rounded-[1.5vh]&quot;>${initial}</div>';">`
                : `<div class="w-full h-full bg-[#0A1224] flex items-center justify-center text-white/40 text-[5vh] font-sans font-bold rounded-[1.5vh]">${initial}</div>`;

            const tlFirst = employee.tl.split(/\s+/)[0] || 'N/A';
            const rmFirst = employee.rm.split(/\s+/)[0] || 'N/A';
            
            let listTagsHtml = "";
            if (employee.tl.toLowerCase() !== employee.name.toLowerCase() && employee.tl.toLowerCase() !== employee.rm.toLowerCase() && tlFirst !== 'N/A') {
                listTagsHtml += `<span class="text-white/60 bg-[#00F0FF]/5 border border-[#00F0FF]/20 px-[1.2vh] py-[0.4vh] rounded shadow-[inset_0_0_0.5vh_rgba(0,240,255,0.05)] text-[1.4vh]">TL: <span class="text-white/90 font-medium">${tlFirst}</span></span>`;
            }
            if (rmFirst !== 'N/A') {
                listTagsHtml += `<span class="text-white/60 bg-[#00F0FF]/5 border border-[#00F0FF]/20 px-[1.2vh] py-[0.4vh] rounded shadow-[inset_0_0_0.5vh_rgba(0,240,255,0.05)] text-[1.4vh]">MGR: <span class="text-white/90 font-medium">${rmFirst}</span></span>`;
            }
                
            const fillPercentage = Math.max(2, (employee.sales / maxSalesBenchmark) * 100);

            let statusMessage = "";
            let statusIcon = "";
            if (rank === 2) { statusMessage = "CLOSING IN"; statusIcon = "🔥"; }
            else if (rank === 3) { statusMessage = "STRONG PACE"; statusIcon = "⚡"; }
            else { statusMessage = "ON TARGET"; statusIcon = "🎯"; }

            return `
                <div class="flex-1 w-full list-row px-[3vh] border-l-[0.8vh] ${borderGlow} shadow-[0_1vh_2vh_rgba(0,0,0,0.6)]" style="animation-delay: ${(rank-1) * 0.15}s; border-left-color: ${rankColor};">
                    
                    <div class="flex items-center justify-between w-full h-full relative z-10">
                        
                        <div class="flex items-center gap-[3.5vh] min-w-0 flex-1 h-full py-[1vh]">
                            <!-- High-Tech Rank -->
                            <div class="font-mono text-[5vh] font-black w-[6vh] shrink-0 text-center drop-shadow-[0_0_1vh_${glowColor}]" style="color: ${rankColor};">#${rank}</div>
                            
                            <!-- Massively Enhanced Avatar Ring (Squircle) for List items -->
                            <div class="relative w-[14vh] h-[14vh] shrink-0 rounded-[2vh] shadow-[0_0_2.5vh_${glowColor.replace('0.7', '0.3')}]" style="background: linear-gradient(135deg, ${rankColor}, rgba(255,255,255,0.1)); padding: 0.4vh;">
                                <div class="w-full h-full bg-[#030508] rounded-[1.6vh] overflow-hidden border border-black/50 relative">
                                    ${photoHtml}
                                </div>
                            </div>
                            
                            <!-- Info Column -->
                            <div class="flex flex-col justify-center min-w-0 pr-[2vh] gap-[1vh] pl-[1vh]">
                                <h3 class="font-sans list-name text-white leading-tight break-words whitespace-normal tracking-wide drop-shadow-[0_0.2vh_0.5vh_rgba(0,0,0,0.8)]">${employee.name}</h3>
                                <div class="font-mono tracking-widest flex items-center flex-wrap uppercase gap-[1.5vh]">
                                    ${listTagsHtml}
                                </div>
                            </div>
                        </div>

                        <!-- Revenue & Status -->
                        <div class="flex flex-col items-end justify-center shrink-0 pl-[2vh] whitespace-nowrap h-full">
                            <div class="flex items-center gap-[1vh] mb-[1.5vh]">
                                <div class="font-mono list-rev numeric-counter text-white drop-shadow-[0_0.2vh_1vh_rgba(255,255,255,0.2)] tracking-tight" data-target-value="${employee.sales}">
                                    <span class="currency-symbol text-white/30">₹</span>0
                                </div>
                            </div>
                            <div class="bg-[#050810]/80 border border-white/5 px-[2vh] py-[0.6vh] rounded-full shadow-sm flex items-center gap-[1vh]">
                                <span class="animate-pulse text-[1.6vh] grayscale" style="filter: brightness(1.5) sepia(1) hue-rotate(${rank===2 ? '180deg' : (rank===3 ? '340deg' : '200deg')});">${statusIcon}</span>
                                <span class="font-mono text-[1.2vh] tracking-[0.2em] uppercase font-bold" style="color: ${rankColor}; opacity: 0.9;">${statusMessage}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Market Data Bar -->
                    <div class="volume-track bg-white/5">
                        <div class="volume-fill shadow-[0_0_1.5vh_${glowColor}]" style="width: 0%; background: linear-gradient(90deg, transparent, ${rankColor});" data-target-width="${fillPercentage}%"></div>
                    </div>
                </div>
            `;
        }

        async function fetchAndMergeData() {
            const cb = Date.now();
            const photosUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME_PHOTOS)}&z=${cb}`;
            const salesUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME_SALES)}&z=${cb}`;

            try {
                const fetchTimeout = new Promise((_, reject) => setTimeout(() => reject(new Error("Enterprise Network Timeout")), 10000));
                
                const [photosRes, salesRes] = await Promise.race([
                    Promise.all([ fetch(photosUrl), fetch(salesUrl) ]),
                    fetchTimeout
                ]);
                
                if (!photosRes.ok || !salesRes.ok) throw new Error("Secure data access denied.");

                const photosRaw = parseCSV(await photosRes.text());
                const salesRaw = parseCSV(await salesRes.text());

                const exactPhotoMap = new Map();
                const firstNamePhotoMap = new Map();
                
                photosRaw.forEach(row => {
                    if (row.length >= 7) {
                        const fullName = (row[0] || '').trim().toLowerCase();
                        const photoUrl = (row[6] || '').trim();
                        if (fullName && photoUrl) {
                            let cleanUrl = photoUrl;
                            const driveMatch = photoUrl.match(/(?:\/d\/|id=)([\w-]+)/);
                            if (driveMatch && driveMatch[1]) cleanUrl = `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=s1200-c`;
                            exactPhotoMap.set(fullName, cleanUrl);
                            const firstName = fullName.split(/\s+/)[0]; 
                            if (firstName && !firstNamePhotoMap.has(firstName)) firstNamePhotoMap.set(firstName, cleanUrl);
                        }
                    }
                });

                const mergedData = [];
                
                salesRaw.forEach((row) => {
                    const name = (row[0] || '').toString().trim();
                    const rawSalesStr = (row[1] || '').toString().trim(); 
                    const tl = (row[2] || '').toString().trim() || 'N/A'; 
                    const rm = (row[3] || '').toString().trim() || 'N/A'; 

                    let cleanSalesStr = rawSalesStr.replace(/[^0-9.-]+/g, "");
                    const achieved = parseFloat(cleanSalesStr);
                    
                    if (name && !isNaN(achieved) && name.toLowerCase() !== 'employee name') {
                        const searchNameLower = name.toLowerCase();
                        const searchFirstName = searchNameLower.split(/\s+/)[0];
                        const matchedPhoto = exactPhotoMap.get(searchNameLower) || firstNamePhotoMap.get(searchFirstName) || null;
                        mergedData.push({ name, sales: achieved, tl, rm, photo: matchedPhoto });
                    }
                });

                mergedData.sort((a, b) => b.sales - a.sales);
                return mergedData.slice(0, 5);

            } catch (error) {
                console.error("Data Sync Error:", error);
                throw error;
            }
        }

        function renderLeaderboard(data) {
            if (!data || data.length === 0) return;

            const newDataHash = JSON.stringify(data);
            if (newDataHash === previousDataHash) return; 
            previousDataHash = newDataHash;
            
            maxSalesBenchmark = data[0].sales;

            const heroSlot = document.getElementById('hero-slot');
            const contendersSlot = document.getElementById('contenders-slot');

            heroSlot.innerHTML = ''; 
            contendersSlot.innerHTML = '';

            if (data[0]) heroSlot.innerHTML = buildHeroCard(data[0]);
            
            for (let i = 1; i < 5; i++) {
                if (data[i]) contendersSlot.innerHTML += buildListCard(data[i], i + 1);
            }

            setTimeout(() => {
                document.querySelectorAll('.numeric-counter').forEach(counter => {
                    const targetValue = parseFloat(counter.getAttribute('data-target-value'));
                    animateValue(counter, 0, targetValue, 2000); 
                });

                document.querySelectorAll('.volume-fill').forEach((bar, index) => {
                    setTimeout(() => { bar.style.width = bar.getAttribute('data-target-width'); }, 200 + (index * 150));
                });
            }, 100);

            if (!loader.classList.contains('hidden')) {
                loader.classList.add('opacity-0');
                setTimeout(() => { loader.classList.add('hidden'); }, 700);
            }
        }

        async function updateDashboard() {
            try { renderLeaderboard(await fetchAndMergeData()); } 
            catch (err) { 
                if(loader) {
                    loader.classList.remove('opacity-0', 'hidden');
                    loader.innerHTML = `<div style="color:#00F0FF; font-family:monospace; text-align:center; padding:4vh; background:#030508;">DATA FEED OFFLINE<br>${err.message}</div>`;
                }
            }
        }

        let wakeLock = null;
        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } 
            catch (err) { }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateDashboard();
            setInterval(() => { updateDashboard(); }, REFRESH_INTERVAL_MS);
            
            setTimeout(() => {
                requestWakeLock();
                initTvKeepAlive();
                try {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().then(() => {
                            const fsBtn = document.getElementById('fullscreen-btn');
                            // Safely check if button exists before adding classes
                            if(fsBtn) fsBtn.classList.add('text-[#00F0FF]', 'bg-[#00F0FF]/10');
                        }).catch(() => {});
                    }
                } catch(e) {}
            }, 2500);

            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWakeLock(); });

            document.body.addEventListener('click', () => {
                requestWakeLock();
                initTvKeepAlive();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                    const fsBtn = document.getElementById('fullscreen-btn');
                    if(fsBtn) fsBtn.classList.add('text-[#00F0FF]', 'bg-[#00F0FF]/10');
                }
            });

            // Safely attach event listener ONLY if the button is found in the DOM
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(() => {});
                        fullscreenBtn.classList.add('text-[#00F0FF]', 'bg-[#00F0FF]/10');
                    } else {
                        document.exitFullscreen();
                        fullscreenBtn.classList.remove('text-[#00F0FF]', 'bg-[#00F0FF]/10');
                    }
                });
            }
        });
    </script>
</body>
