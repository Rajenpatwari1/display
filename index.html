<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- HARDWARE-LEVEL TV AUTO-REFRESH: Forces browser to reload every 300 seconds (5 mins) natively -->
    <meta http-equiv="refresh" content="300">
    
    <title>Enterprise Sales Terminal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Professional Financial Typography: Outfit for headers, Space Grotesk for strict data grids -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['"Outfit"', 'sans-serif'],
                        'mono': ['"Space Grotesk"', 'monospace'],
                    },
                    colors: {
                        'fin-dark': '#06080F',       // Deep terminal background
                        'fin-panel': '#0C111A',      // Slightly lighter panel
                        'fin-border': '#1C2433',     // Clean panel borders
                        'fin-green': '#00E676',      // Bull market green
                        'fin-gold': '#FFB300',       // Wealth gold
                        'fin-silver': '#90A4AE',     // Silver
                        'fin-bronze': '#D84315'      // Bronze
                    }
                }
            }
        }
    </script>

    <style>
        /* ABSOLUTE 1-PAGE LOCK & HARDWARE ACCELERATION FOR SMART TVs */
        body, html {
            background-color: #060A14;
            color: #ffffff;
            height: 100vh; height: 100dvh;
            width: 100vw;
            margin: 0; padding: 0;
            overflow: hidden; 
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* 
         * TV-SAFE STOCK MARKET BACKGROUND ANIMATION
         * Hardware accelerated linear translation for smooth scrolling
         */
        @keyframes stockScroll {
            0% { transform: translateX(0) translateZ(0); }
            100% { transform: translateX(-50vw) translateZ(0); } /* Moves exactly one SVG width */
        }
        .animate-stock-wave {
            animation: stockScroll 40s linear infinite;
            will-change: transform;
        }

        /* NEW: Hardware Accelerated Aurora Background Orbs */
        @keyframes aurora-1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-8vw, 8vh) scale(1.15); }
        }
        @keyframes aurora-2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(8vw, -8vh) scale(1.15); }
        }

        /* 
         * FINANCIAL PANELS: Premium Frosted Aurora Glass
         */
        .fin-card {
            background: linear-gradient(145deg, rgba(16, 24, 40, 0.5) 0%, rgba(10, 15, 30, 0.7) 100%);
            backdrop-filter: blur(2vh);
            -webkit-backdrop-filter: blur(2vh);
            border: 1px solid rgba(255,255,255,0.08);
            border-top: 1px solid rgba(255,255,255,0.25);
            border-radius: 2vh;
            box-shadow: 0 2.5vh 5vh rgba(0,0,0,0.6), inset 0 1vh 2vh rgba(255,255,255,0.03);
        }

        .hero-card {
            border-top: 0.4vh solid #FFB300;
            background: linear-gradient(180deg, rgba(255, 179, 0, 0.12) 0%, rgba(16, 24, 40, 0.5) 100%);
            box-shadow: 0 2.5vh 5vh rgba(0,0,0,0.6), 0 0 5vh rgba(255,179,0,0.15);
        }

        .list-row {
            background: linear-gradient(90deg, rgba(16, 24, 40, 0.4) 0%, rgba(10, 15, 30, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5vh;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(1.5vh);
            -webkit-backdrop-filter: blur(1.5vh);
        }

        /* Stock Market Volume Bar (Progress) */
        .volume-track {
            position: absolute; bottom: 0; left: 0; right: 0; height: 0.3vh;
            background: rgba(255,255,255,0.05);
        }
        .volume-fill {
            height: 100%;
            transition: width 1.5s cubic-bezier(0.2, 0.8, 0.2, 1); 
            box-shadow: 0 0 1vh currentColor;
        }

        /* TV Scaling Typography (Fixed constraints) */
        .header-title { font-size: 2.8vh; letter-spacing: 0.3em; font-weight: 800; }
        .hero-name { font-size: 4.0vh; line-height: 1.1; font-weight: 700; letter-spacing: 0.02em; }
        .hero-rev { font-size: 6.5vh; line-height: 1; font-weight: 700; }
        
        .list-name { font-size: 3vh; line-height: 1.2; font-weight: 600; }
        .list-rev { font-size: 4vh; line-height: 1; font-weight: 700; }

        .currency-symbol { font-weight: 400; opacity: 0.5; margin-right: 0.5vh; font-size: 0.7em; }
        
        .avatar-img { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            border-radius: 1vh; 
        }

        /* Clean Entrance Animations */
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(2vh); } 100% { opacity: 1; transform: translateY(0); } }
        .anim-fade-up { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards; }

        /* NEW: Footer Stock Ticker Animation */
        @keyframes tickerScroll {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
        .animate-ticker {
            animation: tickerScroll 25s linear infinite;
            will-change: transform;
            white-space: nowrap;
        }

        /* NEW: Cool Holographic Aesthetics */
        @keyframes spinRing { 100% { transform: rotate(360deg); } }
        .holo-ring { 
            position: absolute; inset: -1.5vh; border-radius: 50%;
            border: 0.3vh dashed rgba(255, 179, 0, 0.4);
            border-top: 0.4vh solid #FFB300;
            animation: spinRing 12s linear infinite;
            z-index: 0;
        }
        .name-glow-hero {
            background: linear-gradient(90deg, #FFFFFF 0%, #FFD54F 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0.5vh 1vh rgba(255,179,0,0.5));
        }
        .name-glow-list {
            text-shadow: 0 0.2vh 1vh rgba(255,255,255,0.4);
        }
    </style>
</head>

                <path d="M0,250 L50,220 L100,240 L150,180 L200,190 L250,120 L300,150 L350,80 L400,110 L450,50 L500,90 L550,40 L600,70 L650,20 L700,60 L750,10 L800,40 L850,20 L900,50 L950,10 L1000,30 L1000,300 L0,300 Z" fill="url(#stockGrad)" stroke="none" />

                <path d="M0,250 L50,220 L100,240 L150,180 L200,190 L250,120 L300,150 L350,80 L400,110 L450,50 L500,90 L550,40 L600,70 L650,20 L700,60 L750,10 L800,40 L850,20 L900,50 L950,10 L1000,30 L1000,300 L0,300 Z" fill="url(#stockGrad)" stroke="none" />

    <script>
        // 12-HOUR CLOCK & DATE LOGIC
        setInterval(() => {
            const now = new Date();
            try {
                // Time (e.g., 1:00 PM)
                document.getElementById('live-clock').innerText = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                
                // Date (e.g., WED, AUG 5)
                const options = { weekday: 'short', month: 'short', day: 'numeric' };
                document.getElementById('live-date').innerText = now.toLocaleDateString('en-US', options);

                // Dynamic Footer Ticker (e.g. AS OF AUGUST 5TH - TOP FIVE PERFORMERS)
                const month = now.toLocaleString('en-US', { month: 'long' }).toUpperCase();
                const date = now.getDate();
                
                // Get Ordinal (ST, ND, RD, TH)
                let ordinal = "TH";
                if (date > 3 && date < 21) ordinal = "TH";
                else {
                    const lastDigit = date % 10;
                    if(lastDigit === 1) ordinal = "ST";
                    else if(lastDigit === 2) ordinal = "ND";
                    else if(lastDigit === 3) ordinal = "RD";
                }

                const ticker = document.getElementById('footer-ticker');
                if (ticker && ticker.dataset.updatedForDay != date) {
                    const dateStr = `AS OF ${month} ${date}${ordinal}`;
                    const repeatingText = `
                        <span class="flex items-center gap-[1vh]"><span class="text-[#FFB300]">★</span> ${dateStr}</span>
                        <span>|</span>
                        <span class="flex items-center gap-[1vh] text-[#00E676]">TOP FIVE PERFORMERS</span>
                        <span>|</span>
                    `;
                    // Repeat it 8 times so it loops seamlessly on massive TVs
                    ticker.innerHTML = repeatingText.repeat(8);
                    ticker.dataset.updatedForDay = date; 
                }

            } catch (e) {
                // TV Fallback
                document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
            }
        }, 1000);

        // TV NO-SLEEP & AUTO-RELOAD
        const TV_AUTO_RELOAD_MINUTES = 5;
        setTimeout(() => { window.location.reload(); }, TV_AUTO_RELOAD_MINUTES * 60 * 1000);

        function initTvKeepAlive() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                setInterval(() => {
                    if (ctx.state === 'suspended') ctx.resume();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    gain.gain.value = 0.0001;
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                }, 25000);
            } catch (e) { console.log("Audio Heartbeat not supported"); }
        }

        const SHEET_ID = '1zm49yxiWzi8LCrazWa7VMTNQO0f5qPRmY3Sf0ILVyQw';
        const SHEET_NAME_PHOTOS = 'Employee Photo';
        const SHEET_NAME_SALES = 'Sheet2';
        const REFRESH_INTERVAL_MS = 20000;
        let previousDataHash = "";
        let maxSalesBenchmark = 1; 

        const loader = document.getElementById('loader');

        // TV DEBUGGERS
        window.onerror = function(msg, url, line) {
            if(loader) {
                loader.classList.remove('opacity-0', 'hidden');
                loader.innerHTML = `<div style="color:#ff3333; font-family:monospace; text-align:center; padding:4vh;">SYS_ERR: ${msg} (Line ${line})</div>`;
            }
        };

        function parseCSV(text) {
            const result = []; let row = []; let inQuotes = false; let currentValue = "";
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    if (inQuotes && text[i+1] === '"') { currentValue += '"'; i++; } 
                    else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) {
                    row.push(currentValue); currentValue = "";
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && text[i+1] === '\n') i++; 
                    row.push(currentValue); result.push(row); row = []; currentValue = "";
                } else { currentValue += char; }
            }
            if (currentValue || row.length > 0) { row.push(currentValue); result.push(row); }
            return result;
        }

        function formatRupees(num) {
            let formatted = "0";
            try { formatted = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 }).format(num); } 
            catch(e) { formatted = Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
            return `<span class="currency-symbol">₹</span>${formatted}`;
        }

        function animateValue(element, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!document.contains(element)) return; 
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 5); 
                const currentVal = Math.floor(easeOut * (end - start) + start);
                element.innerHTML = formatRupees(currentVal);
                if (progress < 1) window.requestAnimationFrame(step);
                else element.innerHTML = formatRupees(end); 
            };
            window.requestAnimationFrame(step);
        }

        // FINANCIAL HERO CARD (Rank 1 - Perfectly Centered)
        function buildHeroCard(employee) {
            const initial = employee.name.charAt(0).toUpperCase();
            
            // Fixed avatar rounding to perfectly match the spinning holographic ring
            const photoHtml = employee.photo 
                ? `<img src="${employee.photo}" class="avatar-img rounded-full shadow-[0_1vh_3vh_rgba(0,0,0,0.5)]" onerror="this.onerror=null; this.outerHTML='<div class=&quot;w-full h-full bg-[#1C2433] rounded-full flex items-center justify-center text-white/30 text-[9vh] font-sans font-medium&quot;>${initial}</div>';">`
                : `<div class="w-full h-full bg-[#1C2433] rounded-full flex items-center justify-center text-white/30 text-[9vh] font-sans font-medium">${initial}</div>`;

            const tlFirst = employee.tl.split(/\s+/)[0] || 'N/A';
            const rmFirst = employee.rm.split(/\s+/)[0] || 'N/A';
            
            let tagsHtml = "";
            if (employee.tl.toLowerCase() !== employee.name.toLowerCase() && employee.tl.toLowerCase() !== employee.rm.toLowerCase() && tlFirst !== 'N/A') {
                tagsHtml += `<div class="bg-[#FFB300]/10 border border-[#FFB300]/30 px-[2vh] py-[0.8vh] rounded-full text-[#FFB300] shadow-[0_0_1vh_rgba(255,179,0,0.2)]">TL: <span class="text-white ml-[0.5vh]">${tlFirst}</span></div>`;
            }
            if (rmFirst !== 'N/A') {
                tagsHtml += `<div class="bg-[#FFB300]/10 border border-[#FFB300]/30 px-[2vh] py-[0.8vh] rounded-full text-[#FFB300] shadow-[0_0_1vh_rgba(255,179,0,0.2)]">MGR: <span class="text-white ml-[0.5vh]">${rmFirst}</span></div>`;
            }

            return `
                <div class="w-full h-full flex flex-col items-center justify-center text-center">
                    
                    <!-- Rank 1 Badge (Cyber Gold) -->
                    <div class="mb-[4vh] relative z-20">
                        <span class="font-mono text-[#06080F] bg-gradient-to-r from-[#FFB300] to-[#FFD54F] px-[3vh] py-[1vh] text-[1.8vh] tracking-[0.4em] uppercase font-extrabold rounded-full shadow-[0_0_3vh_rgba(255,179,0,0.6)]">
                            TOP PERFORMER
                        </span>
                    </div>

                    <!-- Holographic Circular Avatar -->
                    <div class="relative w-[32vh] h-[32vh] mb-[4vh] p-[0.6vh] bg-gradient-to-b from-[#FFB300] to-transparent rounded-full shadow-[0_0_5vh_rgba(255,179,0,0.2)]">
                        <div class="holo-ring"></div>
                        <div class="w-full h-full bg-[#06080F] rounded-full overflow-hidden relative z-10">
                            ${photoHtml}
                        </div>
                    </div>

                    <!-- Name & Tags (BUG FIX: Removed truncate, added text wrap and neon glow) -->
                    <h2 class="font-sans hero-name name-glow-hero mb-[2vh] tracking-wide w-full px-[2vh] leading-tight break-words whitespace-normal">${employee.name}</h2>
                    
                    <div class="font-mono text-[1.4vh] tracking-wider flex items-center justify-center gap-[1.5vh] mb-[4vh] w-full uppercase font-bold">
                        ${tagsHtml}
                    </div>

                    <!-- Stock Market Revenue Display -->
                    <div class="flex flex-col items-center w-full bg-gradient-to-b from-[#06080F]/80 to-[#06080F]/40 py-[2vh] rounded-xl border border-[#00E676]/30 shadow-[0_0_3vh_rgba(0,230,118,0.15)]">
                        <p class="font-mono text-[1.5vh] text-[#00E676]/80 tracking-[0.3em] uppercase mb-[0.5vh] font-bold">Total Generated</p>
                        <div class="flex items-center justify-center gap-[1.5vh]">
                            <svg class="w-[4.5vh] h-[4.5vh] text-[#00E676] drop-shadow-[0_0_1vh_rgba(0,230,118,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                            <div class="font-mono hero-rev numeric-counter text-[#00E676] drop-shadow-[0_0_2vh_rgba(0,230,118,0.6)]" data-target-value="${employee.sales}">
                                <span class="currency-symbol text-[#00E676]/60">₹</span>0
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // FINANCIAL LIST CARD (Strict Row Alignment)
        function buildListCard(employee, rank) {
            const initial = employee.name.charAt(0).toUpperCase();
            
            // Enhanced Financial Colors for ranks with glowing accents
            let rankColor, glowColor, borderGlow;
            if (rank === 2) { rankColor = "#E0E0E0"; glowColor = "rgba(224, 224, 224, 0.8)"; borderGlow = "border-[#E0E0E0]/50"; }      // Silver
            else if (rank === 3) { rankColor = "#FF8A65"; glowColor = "rgba(255, 138, 101, 0.8)"; borderGlow = "border-[#FF8A65]/50"; }   // Bronze
            else { rankColor = "#00B0FF"; glowColor = "rgba(0, 176, 255, 0.8)"; borderGlow = "border-[#00B0FF]/40"; }                              // Cyber Blue for 4 & 5

            const photoHtml = employee.photo 
                ? `<img src="${employee.photo}" class="avatar-img rounded-[1vh]" onerror="this.onerror=null; this.outerHTML='<div class=&quot;w-full h-full bg-[#1C2433] rounded-[1vh] flex items-center justify-center text-white/30 text-[5vh] font-sans font-medium&quot;>${initial}</div>';">`
                : `<div class="w-full h-full bg-[#1C2433] rounded-[1vh] flex items-center justify-center text-white/30 text-[5vh] font-sans font-medium">${initial}</div>`;

            const tlFirst = employee.tl.split(/\s+/)[0] || 'N/A';
            const rmFirst = employee.rm.split(/\s+/)[0] || 'N/A';
            
            let listTagsHtml = "";
            if (employee.tl.toLowerCase() !== employee.name.toLowerCase() && employee.tl.toLowerCase() !== employee.rm.toLowerCase() && tlFirst !== 'N/A') {
                listTagsHtml += `<span class="text-white/50 bg-white/5 px-[1vh] py-[0.3vh] rounded">TL: <span class="text-white/90">${tlFirst}</span></span>`;
            }
            if (rmFirst !== 'N/A') {
                listTagsHtml += `<span class="text-white/50 bg-white/5 px-[1vh] py-[0.3vh] rounded">MGR: <span class="text-white/90">${rmFirst}</span></span>`;
            }
                
            const fillPercentage = Math.max(2, (employee.sales / maxSalesBenchmark) * 100);

            return `
                <div class="flex-1 w-full list-row flex flex-col justify-center anim-fade-up px-[3vh] border-l-[0.5vh] ${borderGlow} shadow-[0_1vh_2vh_rgba(0,0,0,0.5)]" style="animation-delay: ${(rank-1) * 0.15}s; border-left-color: ${rankColor};">
                    
                    <div class="flex items-center justify-between w-full h-full py-[1vh] relative z-10">
                        
                        <!-- Rank, Avatar & Name (Left Aligned) -->
                        <div class="flex items-center gap-[3vh] min-w-0 flex-1">
                            
                            <!-- Glowing Cyber Rank Block -->
                            <div class="font-mono text-[4vh] font-black w-[5vh] text-center drop-shadow-[0_0_1.5vh_${glowColor}]" style="color: ${rankColor};">0${rank}</div>
                            
                            <!-- Square Avatar with Colored Border -->
                            <div class="w-[13vh] h-[13vh] shrink-0 p-[0.3vh] rounded-[1.2vh] shadow-[0_0_2vh_${glowColor.replace('0.8', '0.2')}]" style="background-color: ${rankColor};">
                                <div class="w-full h-full bg-[#06080F] rounded-[1vh] overflow-hidden">
                                    ${photoHtml}
                                </div>
                            </div>
                            
                            <!-- Info Column (BUG FIX: Removed truncate, allowed name to wrap safely) -->
                            <div class="flex flex-col min-w-0 pr-[2vh] gap-[0.8vh]">
                                <h3 class="font-sans list-name name-glow-list text-white leading-tight break-words whitespace-normal">${employee.name}</h3>
                                <div class="font-mono text-[1.3vh] tracking-wider flex items-center flex-wrap uppercase gap-[1vh]">
                                    ${listTagsHtml}
                                </div>
                            </div>
                        </div>

                        <!-- Revenue & Trend (Right Aligned) -->
                        <div class="flex flex-col items-end shrink-0 pl-[2vh]">
                            <div class="flex items-center gap-[1vh]">
                                <svg class="w-[2.5vh] h-[2.5vh] text-[#00E676] drop-shadow-[0_0_1vh_rgba(0,230,118,0.5)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                                <div class="font-mono list-rev numeric-counter text-white drop-shadow-[0_0_1vh_rgba(255,255,255,0.3)]" data-target-value="${employee.sales}">
                                    <span class="currency-symbol text-white/40">₹</span>0
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Volume Bar Track (Laser effect) -->
                    <div class="volume-track bg-white/5">
                        <div class="volume-fill shadow-[0_0_1.5vh_${glowColor}]" style="width: 0%; background-color: ${rankColor};" data-target-width="${fillPercentage}%"></div>
                    </div>
                </div>
            `;
        }

        async function fetchAndMergeData() {
            const cb = Date.now();
            const photosUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME_PHOTOS)}&z=${cb}`;
            const salesUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME_SALES)}&z=${cb}`;

            try {
                const fetchTimeout = new Promise((_, reject) => setTimeout(() => reject(new Error("TV Network Timeout")), 10000));
                
                const [photosRes, salesRes] = await Promise.race([
                    Promise.all([ fetch(photosUrl), fetch(salesUrl) ]),
                    fetchTimeout
                ]);
                
                if (!photosRes.ok || !salesRes.ok) throw new Error("Data access denied.");

                const photosRaw = parseCSV(await photosRes.text());
                const salesRaw = parseCSV(await salesRes.text());

                const exactPhotoMap = new Map();
                const firstNamePhotoMap = new Map();
                
                photosRaw.forEach(row => {
                    if (row.length >= 7) {
                        const fullName = (row[0] || '').trim().toLowerCase();
                        const photoUrl = (row[6] || '').trim();
                        if (fullName && photoUrl) {
                            let cleanUrl = photoUrl;
                            const driveMatch = photoUrl.match(/(?:\/d\/|id=)([\w-]+)/);
                            if (driveMatch && driveMatch[1]) cleanUrl = `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=s1200-c`;
                            exactPhotoMap.set(fullName, cleanUrl);
                            const firstName = fullName.split(/\s+/)[0]; 
                            if (firstName && !firstNamePhotoMap.has(firstName)) firstNamePhotoMap.set(firstName, cleanUrl);
                        }
                    }
                });

                const mergedData = [];
                
                salesRaw.forEach((row) => {
                    const name = (row[0] || '').toString().trim();
                    const rawSalesStr = (row[1] || '').toString().trim(); 
                    const tl = (row[2] || '').toString().trim() || 'N/A'; 
                    const rm = (row[3] || '').toString().trim() || 'N/A'; 

                    let cleanSalesStr = rawSalesStr.replace(/[^0-9.-]+/g, "");
                    const achieved = parseFloat(cleanSalesStr);
                    
                    if (name && !isNaN(achieved) && name.toLowerCase() !== 'employee name') {
                        const searchNameLower = name.toLowerCase();
                        const searchFirstName = searchNameLower.split(/\s+/)[0];
                        const matchedPhoto = exactPhotoMap.get(searchNameLower) || firstNamePhotoMap.get(searchFirstName) || null;
                        mergedData.push({ name, sales: achieved, tl, rm, photo: matchedPhoto });
                    }
                });

                mergedData.sort((a, b) => b.sales - a.sales);
                return mergedData.slice(0, 5);

            } catch (error) {
                console.error("Sync Error:", error);
                throw error;
            }
        }

        function renderLeaderboard(data) {
            if (!data || data.length === 0) return;

            const newDataHash = JSON.stringify(data);
            if (newDataHash === previousDataHash) return; 
            previousDataHash = newDataHash;
            
            maxSalesBenchmark = data[0].sales;

            const heroSlot = document.getElementById('hero-slot');
            const contendersSlot = document.getElementById('contenders-slot');

            heroSlot.innerHTML = ''; 
            contendersSlot.innerHTML = '';

            if (data[0]) heroSlot.innerHTML = buildHeroCard(data[0]);
            
            for (let i = 1; i < 5; i++) {
                if (data[i]) contendersSlot.innerHTML += buildListCard(data[i], i + 1);
            }

            setTimeout(() => {
                document.querySelectorAll('.numeric-counter').forEach(counter => {
                    const targetValue = parseFloat(counter.getAttribute('data-target-value'));
                    animateValue(counter, 0, targetValue, 2000); 
                });

                document.querySelectorAll('.volume-fill').forEach((bar, index) => {
                    setTimeout(() => { bar.style.width = bar.getAttribute('data-target-width'); }, 200 + (index * 150));
                });
            }, 100);

            if (!loader.classList.contains('hidden')) {
                loader.classList.add('opacity-0');
                setTimeout(() => { loader.classList.add('hidden'); }, 700);
            }
        }

        async function updateDashboard() {
            try { renderLeaderboard(await fetchAndMergeData()); } 
            catch (err) { 
                if(loader) {
                    loader.classList.remove('opacity-0', 'hidden');
                    loader.innerHTML = `<div style="color:#ff3333; font-family:monospace; text-align:center; padding:4vh; background:#06080F;">DATA OFFLINE<br>${err.message}</div>`;
                }
            }
        }

        let wakeLock = null;
        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } 
            catch (err) { }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateDashboard();
            setInterval(updateDashboard, REFRESH_INTERVAL_MS);
            
            setTimeout(() => {
                requestWakeLock();
                initTvKeepAlive();
                try {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().then(() => {
                            const fsBtn = document.getElementById('fullscreen-btn');
                            if(fsBtn) fsBtn.classList.add('text-white', 'bg-white/10');
                        }).catch(() => {});
                    }
                } catch(e) {}
            }, 2500);

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') requestWakeLock();
            });

            document.body.addEventListener('click', () => {
                requestWakeLock();
                initTvKeepAlive();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                    const fsBtn = document.getElementById('fullscreen-btn');
                    if(fsBtn) fsBtn.classList.add('text-white', 'bg-white/10');
                }
            });

            const fullscreenBtn = document.getElementById('fullscreen-btn');
            fullscreenBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                    fullscreenBtn.classList.add('text-white', 'bg-white/10');
                } else {
                    document.exitFullscreen();
                    fullscreenBtn.classList.remove('text-white', 'bg-white/10');
                }
            });
        });
    </script>
</body>
</html>
