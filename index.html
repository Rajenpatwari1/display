<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- HARDWARE-LEVEL TV AUTO-REFRESH: Forces browser to reload every 300 seconds (5 mins) natively -->
    <meta http-equiv="refresh" content="300">
    
    <title>Enterprise Sales Terminal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Premium Silicon Valley Typography: Outfit for UI, Space Grotesk for Data/Numbers -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif'],
                        mono: ['"Space Grotesk"', 'monospace'],
                    },
                    colors: {
                        'obsidian': '#050505',
                        'accent-cyan': '#00E5FF',
                        'accent-purple': '#8A2BE2',
                        'accent-pink': '#FF007A',
                        'text-muted': '#8A8F98'
                    }
                }
            }
        }
    </script>

    <style>
        /* ABSOLUTE 1-PAGE LOCK & HARDWARE ACCELERATION FOR SMART TVs */
        body, html {
            background-color: #04020a; /* Deep Cyber Black */
            color: #ffffff;
            height: 100vh; height: 100dvh;
            width: 100vw;
            margin: 0; padding: 0;
            overflow: hidden; 
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* "Cyber Tech" Background */
        .tv-bg {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(circle at 50% -20%, #1a0b2e 0%, #090514 50%, #000000 100%);
        }
        
        /* Subtle digital grid overlay */
        .tv-bg::after {
            content: ''; position: absolute; inset: 0;
            background-image: radial-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 3vh 3vh; opacity: 0.7;
        }

        /* Holographic Glass Panels */
        .mnc-panel {
            background: linear-gradient(145deg, rgba(20, 10, 40, 0.6) 0%, rgba(5, 5, 15, 0.9) 100%);
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-top: 1px solid rgba(0, 229, 255, 0.4); 
            border-radius: 4vh;
            position: relative; 
            overflow: hidden; 
            transform: translateZ(0); 
            box-shadow: 0 4vh 10vh rgba(0,0,0,0.95), inset 0 0 4vh rgba(0,229,255,0.05);
        }
        
        .mnc-row {
            background: linear-gradient(90deg, rgba(20, 10, 40, 0.5) 0%, rgba(5, 5, 15, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-left: 0.6vh solid transparent;
            border-radius: 2.5vh;
            margin-bottom: 1vh;
            position: relative; 
            transform: translateZ(0);
            overflow: hidden;
            box-shadow: 0 1vh 3vh rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        /* High-Tech HUD Spinning Ring */
        .tech-ring {
            position: absolute; inset: -2vh; border-radius: 50%;
            border: 0.2vh dashed rgba(255,255,255,0.1);
            border-top: 0.3vh solid #00E5FF; /* Cyan accent */
            border-bottom: 0.3vh solid #FF007A; /* Pink accent */
            animation: spinRing 12s linear infinite;
        }
        @keyframes spinRing { 100% { transform: rotate(360deg); } }

        /* Exact TV Viewport Scaling */
        .title-text { font-size: 2.5vh; letter-spacing: 0.8em; color: #FFFFFF; font-weight: 800; }
        .hero-name { font-size: 4.5vh; line-height: 1.1; font-weight: 600; letter-spacing: -0.01em; text-shadow: 0 1vh 2vh rgba(0,0,0,0.9); }
        .hero-rev { font-size: 6.5vh; line-height: 1; font-weight: 700; letter-spacing: -0.02em; }
        
        .list-name { font-size: 3vh; line-height: 1.2; font-weight: 600; color: #FFFFFF; letter-spacing: 0.01em; }
        .list-rev { font-size: 4vh; line-height: 1; font-weight: 700; color: #FFFFFF; }

        .currency-symbol { font-family: 'Outfit', sans-serif; font-weight: 300; opacity: 0.6; margin-right: 0.5vh; font-size: 0.7em; }
        
        .avatar-img { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            image-rendering: -webkit-optimize-contrast; 
        }

        /* Laser Progress Lines */
        .progress-line-fill { 
            height: 100%; 
            transition: width 1.5s cubic-bezier(0.2, 0.8, 0.2, 1); 
            transform: translateZ(0);
            border-radius: 0 1vh 1vh 0;
            position: relative;
        }
        /* Laser tip glow */
        .progress-line-fill::after {
            content: ''; position: absolute; right: 0; top: -0.5vh; bottom: -0.5vh;
            width: 1.5vh; background: #fff; border-radius: 50%; filter: blur(4px);
        }

        /* Smooth Corporate Animations */
        @keyframes tvFadeSlide { 0% { opacity: 0; transform: translateX(5vw) translateZ(0); } 100% { opacity: 1; transform: translateX(0) translateZ(0); } }
        @keyframes tvSmoothScale { 0% { opacity: 0; transform: scale(0.92) translateZ(0); } 100% { opacity: 1; transform: scale(1) translateZ(0); } }
        .animate-tv-slide { animation: tvFadeSlide 0.8s cubic-bezier(0.2, 0, 0, 1) backwards; will-change: transform, opacity; }
        .animate-tv-pop { animation: tvSmoothScale 1s cubic-bezier(0.2, 0, 0, 1) backwards; will-change: transform, opacity; }

        /* Continuous Premium Animations */
        @keyframes floatPremium {
            0%, 100% { transform: translateY(0) translateZ(0); }
            50% { transform: translateY(-1vh) translateZ(0); }
        }
        .animate-float-premium { animation: floatPremium 6s ease-in-out infinite; }
        
        @keyframes glowPulseText {
            0%, 100% { text-shadow: 0 0.5vh 1vh rgba(0,0,0,0.9), 0 0 1vh rgba(0, 229, 255, 0.3); }
            50% { text-shadow: 0 0.5vh 1vh rgba(0,0,0,0.9), 0 0 3vh rgba(0, 229, 255, 0.8); }
        }
        .animate-text-glow { animation: glowPulseText 4s ease-in-out infinite; }
    </style>
</head>
<body class="antialiased text-white flex flex-col p-[3vh] gap-[3vh]">

            <h1 class="font-sans text-[3.5vh] uppercase text-white font-black tracking-[0.4em] drop-shadow-[0_0_2vh_rgba(0,229,255,0.6)] relative z-10 flex items-center justify-center whitespace-nowrap">
                <span class="opacity-90 font-light">TOP</span>

    <!-- MAIN SPLIT SCREEN -->
    <main class="flex-1 w-full relative z-10 flex flex-row gap-[4vh] min-h-0">
        
        <!-- Loading Overlay (Matched to dark theme) -->
        <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center z-50 bg-[#050505] transition-opacity duration-700 rounded-3xl">
            <div class="w-[5vh] h-[5vh] border-[0.2vh] border-accent-gold border-t-transparent rounded-full animate-spin mb-[3vh]"></div>
            <p class="font-sans text-[1.8vh] tracking-[0.6em] text-accent-gold/70 uppercase font-light">Retrieving Global Data</p>
        </div>

        <!-- LEFT PANEL: The Hero (#1) -->
        <div class="w-[45%] h-full mnc-panel flex flex-col items-center justify-center p-[5vh] text-center" id="hero-slot">

        </div>

        <!-- RIGHT PANEL: The List (#2 to #5) -->

    <script>
        // Clock (Unchanged Logic)
        setInterval(() => {
            try {
                document.getElementById('live-clock').innerText = new Date().toLocaleTimeString(undefined, { hour12: false });
            } catch (e) {
                document.getElementById('live-clock').innerText = new Date().toTimeString().split(' ')[0];
            }
        }, 1000);

        // TV STABILITY ENGINE (Unchanged Logic)
        const TV_AUTO_RELOAD_MINUTES = 5;
        setTimeout(() => { window.location.reload(); }, TV_AUTO_RELOAD_MINUTES * 60 * 1000);

        // TV KEEP-ALIVE AUDIO HEARTBEAT (Unchanged Logic)
        function initTvKeepAlive() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                setInterval(() => {
                    if (ctx.state === 'suspended') ctx.resume();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    gain.gain.value = 0.0001;
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                }, 25000);
            } catch (e) { console.log("Audio Heartbeat not supported"); }
        }

        const SHEET_ID = '1zm49yxiWzi8LCrazWa7VMTNQO0f5qPRmY3Sf0ILVyQw';
        const SHEET_NAME_PHOTOS = 'Employee Photo';
        const SHEET_NAME_SALES = 'Sheet2';
        const REFRESH_INTERVAL_MS = 20000;
        let previousDataHash = "";
        let maxSalesBenchmark = 1; 

        const loader = document.getElementById('loader');

        // TV DEBUGGER
        window.onerror = function(msg, url, line) {
            if(loader) {
                loader.classList.remove('opacity-0', 'hidden');
                loader.innerHTML = `<div style="color:#ff3333; font-size:3vh; text-align:center; padding:4vh; background:#000; border:1px solid #ff3333; border-radius:2vh; z-index:9999;"><b>TV BROWSER CRASH:</b><br>${msg}<br>Line: ${line}</div>`;
            }
        };
        window.addEventListener('unhandledrejection', function(event) {
            if(loader) {
                loader.classList.remove('opacity-0', 'hidden');
                loader.innerHTML = `<div style="color:#ff3333; font-size:3vh; text-align:center; padding:4vh; background:#000; border:1px solid #ff3333; border-radius:2vh; z-index:9999;"><b>TV NETWORK BLOCKED:</b><br>${event.reason}</div>`;
            }
        });

        // Robust CSV Parser (Unchanged Logic)
        function parseCSV(text) {
            const result = []; let row = []; let inQuotes = false; let currentValue = "";
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    if (inQuotes && text[i+1] === '"') { currentValue += '"'; i++; } 
                    else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) {
                    row.push(currentValue); currentValue = "";
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && text[i+1] === '\n') i++; 
                    row.push(currentValue); result.push(row); row = []; currentValue = "";
                } else { currentValue += char; }
            }
            if (currentValue || row.length > 0) { row.push(currentValue); result.push(row); }
            return result;
        }

        function formatRupees(num) {
            let formatted = "0";
            try { formatted = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 }).format(num); } 
            catch(e) { formatted = Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
            return `<span class="currency-symbol">₹</span>${formatted}`;
        }

        function animateValue(element, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!document.contains(element)) return; 
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 5); 
                const currentVal = Math.floor(easeOut * (end - start) + start);
                element.innerHTML = formatRupees(currentVal);
                if (progress < 1) window.requestAnimationFrame(step);
                else element.innerHTML = formatRupees(end); 
            };
            window.requestAnimationFrame(step);
        }

        // CYBER DESIGN: Hero Card Template
        function buildHeroCard(employee) {
            const initial = employee.name.charAt(0).toUpperCase();
            const photoHtml = employee.photo 
                ? `<img src="${employee.photo}" class="avatar-img rounded-full" onerror="this.onerror=null; this.outerHTML='<div class=\\'w-full h-full rounded-full bg-[#111] flex items-center justify-center text-white/20 text-[9vh] font-sans font-light\\'>${initial}</div>';">`
                : `<div class="w-full h-full rounded-full bg-[#111] flex items-center justify-center text-white/20 text-[9vh] font-sans font-light">${initial}</div>`;

            const tlFirst = employee.tl.split(/\s+/)[0] || 'N/A';
            const rmFirst = employee.rm.split(/\s+/)[0] || 'N/A';
            
            let tagsHtml = "";
            if (employee.tl.toLowerCase() !== employee.name.toLowerCase() && employee.tl.toLowerCase() !== employee.rm.toLowerCase() && tlFirst !== 'N/A') {
                tagsHtml += `<span class="bg-accent-cyan/10 border border-accent-cyan/30 px-[2vh] py-[0.8vh] rounded-xl mx-[0.5vh] text-accent-cyan shadow-[0_0_1vh_rgba(0,229,255,0.2)]">TL <span class="text-white ml-[0.5vh]">${tlFirst}</span></span>`;
            }
            if (rmFirst !== 'N/A') {
                tagsHtml += `<span class="bg-accent-cyan/10 border border-accent-cyan/30 px-[2vh] py-[0.8vh] rounded-xl mx-[0.5vh] text-accent-cyan shadow-[0_0_1vh_rgba(0,229,255,0.2)]">MGR <span class="text-white ml-[0.5vh]">${rmFirst}</span></span>`;
            }

            return `
                <div class="w-full h-full flex flex-col items-center justify-center relative animate-tv-pop animate-float-premium">
                    
                    <!-- Cyber MVP Badge -->
                    <div class="mb-[1.5vh] relative z-20">
                        <span class="relative font-sans text-white text-[1.6vh] tracking-[0.5em] uppercase bg-gradient-to-r from-accent-purple to-accent-pink shadow-[0_0_2vh_rgba(255,0,122,0.6)] px-[3vh] py-[0.8vh] rounded-full font-bold border border-white/20">TOP PERFORMER</span>
                    </div>
                    
                    <!-- Glowing Avatar Shell (Scaled correctly to 34vh) -->
                    <div class="relative w-[34vh] h-[34vh] mb-[2vh] rounded-full p-[0.4vh] bg-gradient-to-b from-accent-cyan via-accent-purple to-transparent shadow-[0_1vh_4vh_rgba(0,229,255,0.3)]">
                        <div class="tech-ring"></div>
                        <div class="w-full h-full rounded-full overflow-hidden bg-[#05030a] border-[0.6vh] border-[#100b1f] relative z-10">
                            ${photoHtml}
                        </div>
                    </div>

                    <!-- Clean Elegant Name -->
                    <h2 class="font-sans hero-name mb-[1.5vh] text-center w-full px-[2vh] text-white/95 animate-text-glow leading-tight">${employee.name}</h2>
                    
                    <div class="font-mono text-[1.3vh] uppercase tracking-[0.2em] flex items-center justify-center mb-[2vh] flex-wrap font-medium">
                        ${tagsHtml}
                    </div>
                    
                    <!-- Cyan Highlighted Revenue -->
                    <div class="w-full text-center">
                        <div class="font-mono hero-rev numeric-counter text-transparent bg-clip-text bg-gradient-to-br from-white via-accent-cyan to-blue-500 drop-shadow-[0_0.5vh_1vh_rgba(0,0,0,1)]" data-target-value="${employee.sales}">
                            <span class="currency-symbol text-accent-cyan/80">₹</span>0
                        </div>
                        <p class="text-accent-cyan/60 font-sans text-[1.6vh] tracking-[0.6em] uppercase mt-[1vh] font-medium">Total Revenue</p>
                    </div>
                </div>
            `;
        }

        // CYBER DESIGN: List Card Template
        function buildListCard(employee, rank) {
            const initial = employee.name.charAt(0).toUpperCase();
            const photoHtml = employee.photo 
                ? `<img src="${employee.photo}" class="avatar-img rounded-full" onerror="this.onerror=null; this.outerHTML='<div class=\\'w-full h-full rounded-full bg-[#111] flex items-center justify-center text-white/20 text-[4vh] font-sans font-light\\'>${initial}</div>';">`
                : `<div class="w-full h-full rounded-full bg-[#111] flex items-center justify-center text-white/20 text-[4vh] font-sans font-light">${initial}</div>`;

            const tlFirst = employee.tl.split(/\s+/)[0] || 'N/A';
            const rmFirst = employee.rm.split(/\s+/)[0] || 'N/A';
            
            // Cyberpunk Theme Colors for Ranks
            let rankGradient, rankColor, borderColor, numColor;
            
            if(rank === 2) { 
                // DEEP PURPLE
                rankGradient = "from-purple-400 to-purple-700"; 
                rankColor = "#a855f7";
                borderColor = "border-purple-600";
                numColor = "text-transparent bg-clip-text bg-gradient-to-b from-purple-300 to-purple-600";
            } else if (rank === 3) { 
                // NEON PINK
                rankGradient = "from-pink-400 to-pink-700"; 
                rankColor = "#ec4899";
                borderColor = "border-pink-600";
                numColor = "text-transparent bg-clip-text bg-gradient-to-b from-pink-300 to-pink-600";
            } else {
                // COOL BLUE (Ranks 4 & 5)
                rankGradient = "from-blue-400 to-blue-700";
                rankColor = "#3b82f6";
                borderColor = "border-blue-600";
                numColor = "text-transparent bg-clip-text bg-gradient-to-b from-blue-300 to-blue-600";
            }

            let listTagsHtml = "";
            if (employee.tl.toLowerCase() !== employee.name.toLowerCase() && employee.tl.toLowerCase() !== employee.rm.toLowerCase() && tlFirst !== 'N/A') {
                listTagsHtml += `<span class="text-[${rankColor}]/90 bg-[${rankColor}]/10 border border-[${rankColor}]/20 px-[1.2vh] py-[0.4vh] rounded-md shadow-sm">TL <span class="text-white/90">${tlFirst}</span></span>`;
            }
            if (rmFirst !== 'N/A') {
                if(listTagsHtml !== "") listTagsHtml += `<span class="text-white/10 mx-[0.5vh]">-</span>`;
                listTagsHtml += `<span class="text-[${rankColor}]/90 bg-[${rankColor}]/10 border border-[${rankColor}]/20 px-[1.2vh] py-[0.4vh] rounded-md shadow-sm">MGR <span class="text-white/90">${rmFirst}</span></span>`;
            }
                
            const fillPercentage = Math.max(2, (employee.sales / maxSalesBenchmark) * 100);

            return `
                <div class="flex-1 w-full mnc-row flex flex-col justify-center animate-tv-slide group px-[3vh]" style="border-left-color: ${rankColor}; animation-delay: ${(rank-1) * 0.1}s;">
                    
                    <div class="flex items-center justify-between w-full h-full relative z-10 py-[0.5vh]">
                        
                        <div class="flex items-center gap-[2.5vh] min-w-0 flex-1">
                            <!-- Glowing Number -->
                            <div class="font-mono text-[3.5vh] font-bold w-[5vh] text-center ${numColor}">0${rank}</div>
                            
                            <!-- Glowing Avatar Border (Scaled correctly to 14vh) -->
                            <div class="w-[14vh] h-[14vh] rounded-full p-[0.3vh] shrink-0 bg-gradient-to-b ${rankGradient} shadow-[0_0_1.5vh_${rankColor}40]">
                                <div class="w-full h-full rounded-full overflow-hidden bg-[#070314] border-[0.4vh] ${borderColor}">
                                    ${photoHtml}
                                </div>
                            </div>
                            
                            <div class="flex flex-col min-w-0 pr-[2vh] gap-[0.5vh]">
                                <h3 class="font-sans list-name truncate drop-shadow-[0_0.2vh_0.5vh_rgba(0,0,0,1)] text-white">${employee.name}</h3>
                                <div class="font-mono text-[1.3vh] uppercase tracking-wider flex items-center flex-wrap gap-[0.5vh] font-medium">
                                    ${listTagsHtml}
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-col items-end shrink-0 pl-[2vh]">
                            <div class="font-mono list-rev numeric-counter text-white/95 drop-shadow-[0_0.5vh_1vh_rgba(0,0,0,1)]" data-target-value="${employee.sales}">
                                <span class="currency-symbol text-[${rankColor}]/80">₹</span>0
                            </div>
                        </div>
                    </div>

                    <!-- Glowing Data Line -->
                    <div class="absolute bottom-0 left-0 right-0 h-[0.4vh] bg-white/5">
                        <div class="progress-line-fill bg-gradient-to-r ${rankGradient} shadow-[0_0_2vh_${rankColor}]" style="width: 0%;" data-target-width="${fillPercentage}%"></div>
                    </div>
                </div>
            `;
        }

        async function fetchAndMergeData() {
            const cb = Date.now();
            const photosUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME_PHOTOS)}&z=${cb}`;
            const salesUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME_SALES)}&z=${cb}`;

            try {
                const fetchTimeout = new Promise((_, reject) => setTimeout(() => reject(new Error("TV Network Timeout")), 10000));
                
                const [photosRes, salesRes] = await Promise.race([
                    Promise.all([ fetch(photosUrl), fetch(salesUrl) ]),
                    fetchTimeout
                ]);
                
                if (!photosRes.ok || !salesRes.ok) throw new Error("Data access denied.");

                const photosRaw = parseCSV(await photosRes.text());
                const salesRaw = parseCSV(await salesRes.text());

                const exactPhotoMap = new Map();
                const firstNamePhotoMap = new Map();
                
                photosRaw.forEach(row => {
                    if (row.length >= 7) {
                        const fullName = (row[0] || '').trim().toLowerCase();
                        const photoUrl = (row[6] || '').trim();
                        if (fullName && photoUrl) {
                            let cleanUrl = photoUrl;
                            const driveMatch = photoUrl.match(/(?:\/d\/|id=)([\w-]+)/);
                            if (driveMatch && driveMatch[1]) cleanUrl = `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=s1200-c`;
                            
                            exactPhotoMap.set(fullName, cleanUrl);
                            const firstName = fullName.split(/\s+/)[0]; 
                            if (firstName && !firstNamePhotoMap.has(firstName)) firstNamePhotoMap.set(firstName, cleanUrl);
                        }
                    }
                });

                const mergedData = [];
                
                salesRaw.forEach((row) => {
                    const name = (row[0] || '').toString().trim();
                    const rawSalesStr = (row[1] || '').toString().trim(); 
                    const tl = (row[2] || '').toString().trim() || 'N/A'; 
                    const rm = (row[3] || '').toString().trim() || 'N/A'; 

                    let cleanSalesStr = rawSalesStr.replace(/[^0-9.-]+/g, "");
                    const achieved = parseFloat(cleanSalesStr);
                    
                    if (name && !isNaN(achieved) && name.toLowerCase() !== 'employee name') {
                        const searchNameLower = name.toLowerCase();
                        const searchFirstName = searchNameLower.split(/\s+/)[0];
                        const matchedPhoto = exactPhotoMap.get(searchNameLower) || firstNamePhotoMap.get(searchFirstName) || null;
                        
                        mergedData.push({ name, sales: achieved, tl, rm, photo: matchedPhoto });
                    }
                });

                mergedData.sort((a, b) => b.sales - a.sales);
                return mergedData.slice(0, 5);

            } catch (error) {
                console.error("Sync Error:", error);
                throw error;
            }
        }

        function renderLeaderboard(data) {
            if (!data || data.length === 0) return;

            const newDataHash = JSON.stringify(data);
            if (newDataHash === previousDataHash) return; 
            previousDataHash = newDataHash;
            
            maxSalesBenchmark = data[0].sales;

            const heroSlot = document.getElementById('hero-slot');
            const contendersSlot = document.getElementById('contenders-slot');

            heroSlot.innerHTML = ''; 
            contendersSlot.innerHTML = '';

            if (data[0]) heroSlot.innerHTML = buildHeroCard(data[0]);
            
            for (let i = 1; i < 5; i++) {
                if (data[i]) contendersSlot.innerHTML += buildListCard(data[i], i + 1);
            }

            setTimeout(() => {
                document.querySelectorAll('.numeric-counter').forEach(counter => {
                    const targetValue = parseFloat(counter.getAttribute('data-target-value'));
                    animateValue(counter, 0, targetValue, 2500); 
                });

                document.querySelectorAll('.progress-line-fill').forEach((bar, index) => {
                    setTimeout(() => { bar.style.width = bar.getAttribute('data-target-width'); }, 300 + (index * 150));
                });
            }, 100);

            if (!loader.classList.contains('hidden')) {
                loader.classList.add('opacity-0');
                setTimeout(() => { loader.classList.add('hidden'); }, 500);
            }
        }

        async function updateDashboard() {
            try { renderLeaderboard(await fetchAndMergeData()); } 
            catch (err) { 
                const loader = document.getElementById('loader');
                if(loader) {
                    loader.classList.remove('opacity-0', 'hidden');
                    loader.innerHTML = `<div style="color:#ff3333; font-size:3vh; text-align:center; padding:4vh; background:#000; border:1px solid #ff3333; border-radius:2vh; z-index:9999;"><b>TV DATA BLOCKED:</b><br>${err.message}</div>`;
                }
            }
        }

        let wakeLock = null;
        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } 
            catch (err) { }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateDashboard();
            setInterval(updateDashboard, REFRESH_INTERVAL_MS);
            
            setTimeout(() => {
                requestWakeLock();
                initTvKeepAlive();
                try {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().then(() => {
                            const fsBtn = document.getElementById('fullscreen-btn');
                            if(fsBtn) fsBtn.classList.add('text-white/90', 'bg-white/10');
                        }).catch(() => {});
                    }
                } catch(e) {}
            }, 2500);

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') requestWakeLock();
            });

            document.body.addEventListener('click', () => {
                requestWakeLock();
                initTvKeepAlive();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                    const fsBtn = document.getElementById('fullscreen-btn');
                    if(fsBtn) fsBtn.classList.add('text-white/90', 'bg-white/10');
                }
            });

            const fullscreenBtn = document.getElementById('fullscreen-btn');
            fullscreenBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                    fullscreenBtn.classList.add('text-white/90', 'bg-white/10');
                } else {
                    document.exitFullscreen();
                    fullscreenBtn.classList.remove('text-white/90', 'bg-white/10');
                }
            });
        });
    </script>
</body>
