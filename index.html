<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- HARDWARE-LEVEL TV AUTO-REFRESH: Forces browser to reload every 300 seconds (5 mins) natively -->
    <meta http-equiv="refresh" content="300">
    
    <title>Enterprise Sales Terminal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Premium Silicon Valley Typography: Outfit for UI, Space Grotesk for Data/Numbers -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif'],
                        mono: ['"Space Grotesk"', 'monospace'],
                    },
                    colors: {
                        'obsidian': '#030303',
                        'glass-panel': 'rgba(20, 20, 20, 0.4)',
                        'glass-border': 'rgba(255, 255, 255, 0.08)',
                        'accent-gold': '#F4D06F',
                        'accent-silver': '#E2E8F0',
                        'accent-bronze': '#D97706',
                        'accent-cyan': '#00E5FF',
                        'text-muted': '#8A8F98'
                    }
                }
            }
        }
    </script>

    <style>
        /* ABSOLUTE 1-PAGE LOCK & HARDWARE ACCELERATION FOR SMART TVs */
        body, html {
            background-color: #010409; /* Deep Sapphire Black */
            color: #ffffff;
            height: 100vh; height: 100dvh;
            width: 100vw;
            margin: 0; padding: 0;
            overflow: hidden; 
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* "Cool" Sapphire Gradient Background */
        .tv-bg {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(circle at 50% 0%, #0a1738 0%, #020816 50%, #000000 100%);
        }
        
        /* Subtle Grid Overlay for Tech Vibe */
        .tv-bg::after {
            content: ''; position: absolute; inset: 0;
            background-image: radial-gradient(rgba(0, 229, 255, 0.08) 1px, transparent 1px);
            background-size: 3vh 3vh; opacity: 0.5;
        }

        /* Frosted Sapphire Panels */
        .mnc-panel {
            background: linear-gradient(145deg, rgba(16, 24, 39, 0.6) 0%, rgba(2, 6, 23, 0.8) 100%);
            border: 1px solid rgba(0, 229, 255, 0.1);
            border-top: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 4vh;
            position: relative; 
            overflow: hidden; 
            transform: translateZ(0); 
            box-shadow: 0 4vh 10vh rgba(0,0,0,0.8), inset 0 0 3vh rgba(0,229,255,0.02);
        }
        
        .mnc-row {
            background: linear-gradient(90deg, rgba(16, 24, 39, 0.4) 0%, rgba(2, 6, 23, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 0.6vh solid transparent;
            border-radius: 2.5vh;
            margin-bottom: 1vh;
            position: relative; 
            transform: translateZ(0);
            overflow: hidden;
            box-shadow: 0 1vh 3vh rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        /* High-Tech Spinning Ring for Hero */
        .tech-ring {
            position: absolute; inset: -2vh; border-radius: 50%;
            border: 0.3vh dashed rgba(255,255,255,0.15);
            border-top: 0.4vh solid #00E5FF;
            animation: spinRing 12s linear infinite;
        }
        @keyframes spinRing { 100% { transform: rotate(360deg); } }

        /* Exact TV Viewport Scaling */
        .title-text { font-size: 2.5vh; letter-spacing: 0.8em; color: #FFFFFF; font-weight: 800; }
        .hero-name { font-size: 5.5vh; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; text-shadow: 0 1vh 2vh rgba(0,0,0,0.8); }
        .hero-rev { font-size: 8.5vh; line-height: 1; font-weight: 700; }
        
        .list-name { font-size: 3.5vh; line-height: 1.2; font-weight: 600; color: #FFFFFF; }
        .list-rev { font-size: 4.5vh; line-height: 1; font-weight: 600; color: #FFFFFF; }

        .currency-symbol { font-family: 'Outfit', sans-serif; font-weight: 300; opacity: 0.6; margin-right: 0.5vh; font-size: 0.7em; }
        
        .avatar-img { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            image-rendering: -webkit-optimize-contrast; 
        }

        /* Laser Progress Data Bars */
        .progress-line-fill { 
            height: 100%; 
            transition: width 1.5s cubic-bezier(0.2, 0.8, 0.2, 1); 
            transform: translateZ(0);
            border-radius: 0 1vh 1vh 0;
            position: relative;
        }
        /* Laser tip glow */
        .progress-line-fill::after {
            content: ''; position: absolute; right: 0; top: -0.5vh; bottom: -0.5vh;
            width: 1.5vh; background: #fff; border-radius: 50%; filter: blur(4px);
        }

        /* Smooth Corporate Animations */
        @keyframes tvFadeSlide { 0% { opacity: 0; transform: translateX(5vw) translateZ(0); } 100% { opacity: 1; transform: translateX(0) translateZ(0); } }
        @keyframes tvSmoothScale { 0% { opacity: 0; transform: scale(0.92) translateZ(0); } 100% { opacity: 1; transform: scale(1) translateZ(0); } }
        .animate-tv-slide { animation: tvFadeSlide 0.8s cubic-bezier(0.2, 0, 0, 1) backwards; will-change: transform, opacity; }
        .animate-tv-pop { animation: tvSmoothScale 1s cubic-bezier(0.2, 0, 0, 1) backwards; will-change: transform, opacity; }
    </style>
</head>
<body class="antialiased text-white flex flex-col p-[3vh] gap-[3vh]">

    <!-- TV NO-SLEEP MEDIA HACK: Invisible playing video prevents TV OS from sleeping/dimming -->
    <video id="tv-keep-awake" loop muted playsinline style="position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; z-index: -1;"></video>

    <!-- PERFORMANCE TV BACKGROUND -->
    <div class="tv-bg"></div>

    <!-- HEADER: Sleek Corporate Minimalist -->
    <header class="flex-none flex justify-between items-center z-10 h-[6vh] pb-[1vh]">
        <!-- Left: Logo -->
        <div class="flex items-center w-1/3">
            <div class="bg-black/40 border border-white/10 px-[2.5vh] py-[1.2vh] rounded-2xl backdrop-blur-md">
                <img src="https://drive.google.com/thumbnail?id=16K2KHrjf4Rl9ZY2OTaeS0YSZK9klqwH4&sz=w400" 
                     alt="Logo" class="h-[3vh] w-auto object-contain"
                     onerror="this.onerror=null; this.outerHTML='<h2 class=\\'text-[2vh] font-bold text-white tracking-[0.3em] uppercase\\'>COMPANY LOGO</h2>';">
            </div>
        </div>

        <!-- Center: Title -->
        <div class="w-1/3 flex flex-col justify-center items-center relative">
            <!-- Glowing High-Tech Aura Behind Title -->
            <div class="absolute inset-0 bg-[#00E5FF]/15 blur-[4vh] rounded-[100%] w-[130%] -left-[15%] h-[150%] -top-[25%] pointer-events-none"></div>
            
            <!-- Massive MNC Title Design optimized for 55" TVs -->
            <h1 class="font-sans text-[4vh] uppercase text-white font-black tracking-[0.35em] drop-shadow-[0_0_2vh_rgba(0,229,255,0.8)] relative z-10 flex items-center justify-center whitespace-nowrap">
                <span class="opacity-90">TOP</span>
                <span class="mx-[2vh] text-[6.5vh] text-transparent bg-clip-text bg-gradient-to-b from-[#00E5FF] to-blue-500 font-mono font-bold leading-none drop-shadow-[0_0_1.5vh_rgba(0,229,255,1)]">5</span> 
                <span class="opacity-90">PERFORMERS</span>
            </h1>

        <!-- Right: Time & Fullscreen -->
        <div class="flex items-center justify-end w-1/3 gap-[3vh]">

            <button id="fullscreen-btn" class="text-white/60 hover:text-white transition-colors p-[1.5vh] bg-black/40 border border-white/10 rounded-xl">
                <svg class="w-[2.5vh] h-[2.5vh]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l5-5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
            </button>
        </div>

    <!-- MAIN SPLIT SCREEN -->
    <main class="flex-1 w-full relative z-10 flex flex-row gap-[4vh] h-[calc(100%-9vh)]">
        
        <!-- Loading Overlay -->
        <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center z-50 bg-[#030108] transition-opacity duration-700 rounded-3xl">
            <div class="w-[5vh] h-[5vh] border-[0.3vh] border-fuchsia-500 border-t-transparent rounded-full animate-spin mb-[3vh]"></div>
            <p class="font-sans text-[2vh] tracking-[0.5em] text-fuchsia-400 uppercase font-bold">Retrieving Global Data</p>
        </div>

        <!-- LEFT PANEL: The Hero (#1) -->
        <div class="w-[45%] h-full mnc-panel flex flex-col items-center justify-center p-[5vh] text-center" id="hero-slot">
            <!-- Injected via JS -->
        </div>

        <!-- RIGHT PANEL: The List (#2 to #5) -->
        <div class="w-[55%] h-full flex flex-col justify-center" id="contenders-slot">
            <!-- Injected via JS -->
        </div>
        
    </main>

    <script>
        // Clock
        setInterval(() => {
            document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('en-IN', { hour12: false });
        }, 1000);

        // TV STABILITY ENGINE: Auto-Refresh Page every 5 minutes to clean TV RAM completely & avoid OS Crashes
        const TV_AUTO_RELOAD_MINUTES = 5;
        setTimeout(() => {
            window.location.reload();
        }, TV_AUTO_RELOAD_MINUTES * 60 * 1000);

        // TV KEEP-ALIVE AUDIO HEARTBEAT (Prevents TV OS from auto-closing browser)
        function initTvKeepAlive() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                // Silent heartbeat tone every 25 seconds
                setInterval(() => {
                    if (ctx.state === 'suspended') ctx.resume();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    gain.gain.value = 0.0001; // Inaudible
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                }, 25000);
            } catch (e) {
                console.log("Audio Heartbeat not supported, fallback active");
            }
        }

        const SHEET_ID = '1zm49yxiWzi8LCrazWa7VMTNQO0f5qPRmY3Sf0ILVyQw';
        const SHEET_NAME_PHOTOS = 'Employee Photo';
        const SHEET_NAME_SALES = 'Sheet2';
        const REFRESH_INTERVAL_MS = 20000; // Safe 20s interval for data polling
        let previousDataHash = "";
        let maxSalesBenchmark = 1; 

        const loader = document.getElementById('loader');

        // Robust CSV Parser
        function parseCSV(text) {
            const result = []; let row = []; let inQuotes = false; let currentValue = "";
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    if (inQuotes && text[i+1] === '"') { currentValue += '"'; i++; } 
                    else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) {
                    row.push(currentValue); currentValue = "";
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && text[i+1] === '\n') i++; 
                    row.push(currentValue); result.push(row); row = []; currentValue = "";
                } else { currentValue += char; }
            }
            if (currentValue || row.length > 0) { row.push(currentValue); result.push(row); }
            return result;
        }

        function formatRupees(num) {
            const formatted = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 }).format(num);
            return `<span class="currency-symbol">₹</span>${formatted}`;
        }

        function animateValue(element, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!document.contains(element)) return; 
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 5); 
                const currentVal = Math.floor(easeOut * (end - start) + start);
                element.innerHTML = formatRupees(currentVal);
                if (progress < 1) window.requestAnimationFrame(step);
                else element.innerHTML = formatRupees(end); 
            };
            window.requestAnimationFrame(step);
        }

        function buildHeroCard(employee) {
            const initial = employee.name.charAt(0).toUpperCase();
            const photoHtml = employee.photo 
                ? `<img src="${employee.photo}" class="avatar-img rounded-full" onerror="this.onerror=null; this.outerHTML='<div class=\\'w-full h-full rounded-full bg-[#111] flex items-center justify-center text-white/30 text-[12vh] font-sans font-light\\'>${initial}</div>';">`
                : `<div class="w-full h-full rounded-full bg-[#111] flex items-center justify-center text-white/30 text-[12vh] font-sans font-light">${initial}</div>`;

            const tlFirst = employee.tl.split(/\s+/)[0] || 'N/A';
            const rmFirst = employee.rm.split(/\s+/)[0] || 'N/A';
            
            let tagsHtml = "";
            if (employee.tl.toLowerCase() !== employee.name.toLowerCase() && employee.tl.toLowerCase() !== employee.rm.toLowerCase() && tlFirst !== 'N/A') {
                tagsHtml += `<span class="bg-[#00E5FF]/10 border border-[#00E5FF]/30 px-[2vh] py-[0.8vh] rounded-xl mx-[1vh] text-[#00E5FF]">TL <span class="text-white ml-[0.5vh]">${tlFirst}</span></span>`;
            }
            if (rmFirst !== 'N/A') {
                tagsHtml += `<span class="bg-[#00E5FF]/10 border border-[#00E5FF]/30 px-[2vh] py-[0.8vh] rounded-xl mx-[1vh] text-[#00E5FF]">MGR <span class="text-white ml-[0.5vh]">${rmFirst}</span></span>`;
            }

            return `
                <div class="w-full h-full flex flex-col items-center justify-center relative animate-tv-pop">
                    
                    <!-- High Tech MVP Badge -->
                    <div class="mb-[2vh] relative z-20">
                        <span class="relative font-mono text-black text-[1.8vh] tracking-[0.4em] uppercase bg-[#00E5FF] shadow-[0_0_2vh_rgba(0,229,255,0.6)] px-[3vh] py-[1vh] rounded-full font-bold">TOP PERFORMER</span>
                    </div>
                    
                    <!-- EXTREME MASSIVE AVATAR (55vh) with Cool Glowing tech rings -->
                    <div class="relative w-[55vh] h-[55vh] mb-[2vh] rounded-full p-[0.8vh] bg-gradient-to-b from-[#00E5FF] to-transparent shadow-[0_0_8vh_rgba(0,229,255,0.3)]">
                        <div class="tech-ring"></div>
                        <div class="w-full h-full rounded-full overflow-hidden bg-[#070314] border-[0.8vh] border-[#0a1738] relative z-10">
                            ${photoHtml}
                        </div>
                    </div>

                    <h2 class="font-sans hero-name mb-[1vh] text-center w-full px-[2vh] truncate text-white">${employee.name}</h2>
                    
                    <div class="font-mono text-[1.5vh] uppercase tracking-widest flex items-center justify-center mb-[2vh] flex-wrap font-bold">
                        ${tagsHtml}
                    </div>
                    
                    <!-- Ice Cool Revenue Text -->
                    <div class="w-full text-center">
                        <div class="font-mono hero-rev numeric-counter text-transparent bg-clip-text bg-gradient-to-r from-white via-[#00E5FF] to-white drop-shadow-[0_0_2vh_rgba(0,229,255,0.4)]" data-target-value="${employee.sales}">
                            <span class="currency-symbol text-[#00E5FF]/80">₹</span>0
                        </div>
                        <p class="text-[#00E5FF]/60 font-sans text-[2vh] tracking-[0.5em] uppercase mt-[1vh] font-bold">Total Revenue</p>
                    </div>
                </div>
            `;
        }

        function buildListCard(employee, rank) {
            const initial = employee.name.charAt(0).toUpperCase();
            const photoHtml = employee.photo 
                ? `<img src="${employee.photo}" class="avatar-img rounded-full" onerror="this.onerror=null; this.outerHTML='<div class=\\'w-full h-full rounded-full bg-[#111] flex items-center justify-center text-white/30 text-[6vh] font-sans font-light\\'>${initial}</div>';">`
                : `<div class="w-full h-full rounded-full bg-[#111] flex items-center justify-center text-white/30 text-[6vh] font-sans font-light">${initial}</div>`;

            const tlFirst = employee.tl.split(/\s+/)[0] || 'N/A';
            const rmFirst = employee.rm.split(/\s+/)[0] || 'N/A';
            
            let listTagsHtml = "";
            if (employee.tl.toLowerCase() !== employee.name.toLowerCase() && employee.tl.toLowerCase() !== employee.rm.toLowerCase() && tlFirst !== 'N/A') {
                listTagsHtml += `<span class="text-[#00E5FF]/60 bg-[#00E5FF]/5 border border-[#00E5FF]/10 px-[1.2vh] py-[0.4vh] rounded-md">TL <span class="text-white/90">${tlFirst}</span></span>`;
            }
            if (rmFirst !== 'N/A') {
                if(listTagsHtml !== "") listTagsHtml += `<span class="text-white/10 mx-[0.5vh]">-</span>`;
                listTagsHtml += `<span class="text-[#00E5FF]/60 bg-[#00E5FF]/5 border border-[#00E5FF]/10 px-[1.2vh] py-[0.4vh] rounded-md">MGR <span class="text-white/90">${rmFirst}</span></span>`;
            }
                
            const fillPercentage = Math.max(2, (employee.sales / maxSalesBenchmark) * 100);

            // "Cool" theme gradients for ranks
            let rankGradient = "from-cyan-400 to-blue-600";
            let rankColor = "#00E5FF";
            let borderColor = "border-cyan-500";
            
            if(rank === 2) { 
                rankGradient = "from-gray-100 to-gray-400"; 
                rankColor = "#f3f4f6";
                borderColor = "border-gray-300";
            } else if (rank === 3) { 
                rankGradient = "from-indigo-300 to-purple-500"; 
                rankColor = "#a5b4fc";
                borderColor = "border-indigo-400";
            } else {
                rankGradient = "from-blue-400 to-blue-800";
                rankColor = "#60a5fa";
                borderColor = "border-blue-500";
            }

            return `
                <div class="flex-1 w-full mnc-row flex flex-col justify-center animate-tv-slide group px-[3vh]" style="border-left-color: ${rankColor}; animation-delay: ${(rank-1) * 0.1}s;">
                    
                    <div class="flex items-center justify-between w-full h-full relative z-10 py-[0.5vh]">
                        
                        <div class="flex items-center gap-[3vh] min-w-0 flex-1">
                            <!-- Clean Tech Rank Number -->
                            <div class="font-mono text-[4.5vh] font-bold w-[6vh] text-center text-transparent bg-clip-text bg-gradient-to-b ${rankGradient}">0${rank}</div>
                            
                            <!-- MAXIMIZED LIST AVATAR (19vh) -->
                            <div class="w-[19vh] h-[19vh] rounded-full p-[0.4vh] shrink-0 bg-gradient-to-b ${rankGradient} shadow-[0_0_2vh_rgba(0,0,0,0.5)]">
                                <div class="w-full h-full rounded-full overflow-hidden bg-[#070314] border-[0.4vh] ${borderColor}">
                                    ${photoHtml}
                                </div>
                            </div>
                            
                            <div class="flex flex-col min-w-0 pr-[2vh] gap-[1vh]">
                                <h3 class="font-sans list-name truncate drop-shadow-md tracking-wide">${employee.name}</h3>
                                <div class="font-mono text-[1.4vh] uppercase tracking-wider flex items-center flex-wrap gap-[0.5vh]">
                                    ${listTagsHtml}
                                </div>
                            </div>
                        </div>

                        <!-- TV Sized List Revenue -->
                        <div class="flex flex-col items-end shrink-0 pl-[2vh]">
                            <div class="font-mono list-rev numeric-counter text-white drop-shadow-[0_1vh_1vh_rgba(0,0,0,0.8)]" data-target-value="${employee.sales}">
                                <span class="currency-symbol">₹</span>0
                            </div>
                        </div>
                    </div>

                    <!-- Glowing Laser Data Line -->
                    <div class="absolute bottom-0 left-0 right-0 h-[0.6vh] bg-white/5">
                        <div class="progress-line-fill bg-gradient-to-r ${rankGradient} shadow-[0_0_2vh_${rankColor}]" style="width: 0%;" data-target-width="${fillPercentage}%"></div>
                    </div>
                </div>
            `;
        }

        async function fetchAndMergeData() {
            const cb = Date.now();
            const photosUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME_PHOTOS)}&z=${cb}`;
            const salesUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME_SALES)}&z=${cb}`;

            try {
                const [photosRes, salesRes] = await Promise.all([ fetch(photosUrl), fetch(salesUrl) ]);
                if (!photosRes.ok || !salesRes.ok) throw new Error("Data access denied.");

                const photosRaw = parseCSV(await photosRes.text());
                const salesRaw = parseCSV(await salesRes.text());

                const exactPhotoMap = new Map();
                const firstNamePhotoMap = new Map();
                
                photosRaw.forEach(row => {
                    if (row.length >= 7) {
                        const fullName = (row[0] || '').trim().toLowerCase();
                        const photoUrl = (row[6] || '').trim();
                        if (fullName && photoUrl) {
                            let cleanUrl = photoUrl;
                            const driveMatch = photoUrl.match(/(?:\/d\/|id=)([\w-]+)/);
                            // HIGH-RES UPGRADE: Requesting sz=s1200-c (1200px Square Crop) for crystal clear TV avatars
                            if (driveMatch && driveMatch[1]) cleanUrl = `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=s1200-c`;
                            
                            exactPhotoMap.set(fullName, cleanUrl);
                            const firstName = fullName.split(/\s+/)[0]; 
                            if (firstName && !firstNamePhotoMap.has(firstName)) firstNamePhotoMap.set(firstName, cleanUrl);
                        }
                    }
                });

                const mergedData = [];
                
                salesRaw.forEach((row) => {
                    const name = (row[0] || '').toString().trim();
                    const rawSalesStr = (row[1] || '').toString().trim(); 
                    const tl = (row[2] || '').toString().trim() || 'N/A'; 
                    const rm = (row[3] || '').toString().trim() || 'N/A'; 

                    let cleanSalesStr = rawSalesStr.replace(/[^0-9.-]+/g, "");
                    const achieved = parseFloat(cleanSalesStr);
                    
                    if (name && !isNaN(achieved) && name.toLowerCase() !== 'employee name') {
                        const searchNameLower = name.toLowerCase();
                        const searchFirstName = searchNameLower.split(/\s+/)[0];
                        const matchedPhoto = exactPhotoMap.get(searchNameLower) || firstNamePhotoMap.get(searchFirstName) || null;
                        
                        mergedData.push({ name, sales: achieved, tl, rm, photo: matchedPhoto });
                    }
                });

                mergedData.sort((a, b) => b.sales - a.sales);
                return mergedData.slice(0, 5);

            } catch (error) {
                console.error("Sync Error:", error);
                throw error;
            }
        }

        function renderLeaderboard(data) {
            if (!data || data.length === 0) return;

            const newDataHash = JSON.stringify(data);
            if (newDataHash === previousDataHash) return; 
            previousDataHash = newDataHash;
            
            maxSalesBenchmark = data[0].sales;

            const heroSlot = document.getElementById('hero-slot');
            const contendersSlot = document.getElementById('contenders-slot');

            heroSlot.innerHTML = ''; 
            contendersSlot.innerHTML = '';

            if (data[0]) heroSlot.innerHTML = buildHeroCard(data[0]);
            
            for (let i = 1; i < 5; i++) {
                if (data[i]) contendersSlot.innerHTML += buildListCard(data[i], i + 1);
            }

            // Staggered Animations
            setTimeout(() => {
                document.querySelectorAll('.numeric-counter').forEach(counter => {
                    const targetValue = parseFloat(counter.getAttribute('data-target-value'));
                    animateValue(counter, 0, targetValue, 2500); 
                });

                document.querySelectorAll('.progress-line-fill').forEach((bar, index) => {
                    setTimeout(() => { bar.style.width = bar.getAttribute('data-target-width'); }, 300 + (index * 150));
                });
            }, 100);

            if (!loader.classList.contains('hidden')) {
                loader.classList.add('opacity-0');
                setTimeout(() => { loader.classList.add('hidden'); }, 500);
            }
        }

        async function updateDashboard() {
            try { renderLeaderboard(await fetchAndMergeData()); } 
            catch (err) { console.warn("Sync Issue:", err.message); }
        }

        // Screen Wake Lock API to prevent TV/Laptop from sleeping
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log("Wake Lock ignored by browser:", err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateDashboard();
            setInterval(updateDashboard, REFRESH_INTERVAL_MS);
            
            // ULTIMATE TV NO-SLEEP HACK: Stream a blank canvas to the hidden video
            // TVs never go to sleep if they detect active media playback
            try {
                const dummyCanvas = document.createElement('canvas');
                dummyCanvas.width = 1; dummyCanvas.height = 1;
                dummyCanvas.getContext('2d').fillRect(0, 0, 1, 1);
                const videoElement = document.getElementById('tv-keep-awake');
                videoElement.srcObject = dummyCanvas.captureStream();
                videoElement.play().catch(() => {});
            } catch(e) {}
            
            // 1. ATTEMPT AUTOMATIC FULLSCREEN & KEEP-ALIVE (For Digital Signage TVs)
            setTimeout(() => {
                // Try to force Wake Lock and Heartbeat immediately
                requestWakeLock();
                initTvKeepAlive();
                
                // Try to force Fullscreen without a click
                try {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().then(() => {
                            const fsBtn = document.getElementById('fullscreen-btn');
                            if(fsBtn) fsBtn.classList.add('text-white', 'bg-white/10');
                        }).catch((err) => {
                            console.warn("Auto-fullscreen blocked by TV security. TV requires Kiosk mode or one initial click.", err.message);
                        });
                    }
                } catch(e) {}
            }, 2500); // 2.5 second delay allows the TV OS to finish loading the browser first

            // Keep TV screen active if it switches tabs and comes back
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') requestWakeLock();
            });

            // 2. FALLBACK: Re-acquire wake lock and trigger FULLSCREEN on first remote click anywhere (if auto fails)
            document.body.addEventListener('click', () => {
                requestWakeLock();
                initTvKeepAlive();
                
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                    const fsBtn = document.getElementById('fullscreen-btn');
                    if(fsBtn) fsBtn.classList.add('text-white', 'bg-white/10');
                }
            });

            const fullscreenBtn = document.getElementById('fullscreen-btn');
            fullscreenBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent double-triggering with body click
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                    fullscreenBtn.classList.add('text-white', 'bg-white/10');
                } else {
                    document.exitFullscreen();
                    fullscreenBtn.classList.remove('text-white', 'bg-white/10');
                }
            });
        });
    </script>
</body>
</html>
