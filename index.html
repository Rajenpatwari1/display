<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="refresh" content="300">
    <title>Enterprise Sales Terminal - Top Performers</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Space+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['"Outfit"', 'sans-serif'],
                        'mono': ['"Space Grotesk"', 'monospace'],
                    },
                    colors: {
                        'fin-dark': '#030508',       
                        'fin-panel': '#0A0F1A',      
                        'fin-cyan': '#00F0FF',       
                        'fin-gold': '#FFD700',
                        'reward-kashmir': '#87CEEB',
                        'reward-wayanad': '#2ECC71'
                    }
                }
            }
        }
    </script>

    <style>
        body, html {
            background-color: #030508;
            color: #ffffff;
            height: 100vh; height: 100dvh;
            width: 100vw;
            margin: 0; padding: 0;
            overflow: hidden; 
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Cyber Background Animations */
        @keyframes aurora-1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-5vw, 5vh) scale(1.1); } }
        @keyframes aurora-2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(5vw, -5vh) scale(1.15); } }

        /* General Card Styles */
        .glass-panel {
            background: linear-gradient(145deg, rgba(10, 15, 26, 0.7) 0%, rgba(5, 8, 15, 0.9) 100%);
            backdrop-filter: blur(2vh); -webkit-backdrop-filter: blur(2vh);
            border: 1px solid rgba(0, 240, 255, 0.1);
            border-radius: 2vh;
        }

        /* STRICT Typography bounds to prevent overlapping/wrapping */
        .header-title { font-size: 4.5vh; letter-spacing: 0.15em; font-weight: 900; line-height: 1; }
        .currency-symbol { font-weight: 400; opacity: 0.6; margin-right: 0.5vh; font-size: 0.8em; }
        
        .avatar-img { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            object-position: top center;
        }

        /* Animations */
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(2vh); } 100% { opacity: 1; transform: translateY(0); } }
        .anim-fade-up { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
        @keyframes tickerScroll { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        .animate-ticker { animation: tickerScroll 25s linear infinite; will-change: transform; white-space: nowrap; }
        @keyframes shimmer-sweep { 0% { transform: translateX(-150%) skewX(-20deg); } 100% { transform: translateX(200%) skewX(-20deg); } }

        /* Holographic scanning line for revenue panel */
        @keyframes scan-line { 0% { left: -10%; opacity: 0; } 50% { opacity: 1; } 100% { left: 110%; opacity: 0; } }
        .animate-scan {
            position: absolute; top: 0; bottom: 0; width: 2vh;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: skewX(-20deg);
            animation: scan-line 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* BULLETPROOF PING-PONG ANIMATION (Fixed Transform Overwrite) */
        @keyframes travel-pingpong {
            0%, 5% { left: 0%; transform: translateY(-50%) scaleX(1); }
            45%, 50% { left: calc(100% - 4vh); transform: translateY(-50%) scaleX(1); }
            50.1%, 55% { left: calc(100% - 4vh); transform: translateY(-50%) scaleX(-1); }
            95%, 100% { left: 0%; transform: translateY(-50%) scaleX(-1); }
        }
        
        /* Flight Bobbing Animation */
        @keyframes plane-bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-1vh); }
        }
        .plane-wrapper { animation: plane-bob 1.5s ease-in-out infinite; transform-origin: center; }

        /* Bus Bumping Animation */
        @keyframes bus-bump {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-0.2vh) rotate(-1deg); }
            50% { transform: translateY(0.1vh) rotate(1deg); }
            75% { transform: translateY(-0.2vh) rotate(1deg); }
        }
        .bus-wrapper { animation: bus-bump 0.4s linear infinite; transform-origin: bottom center; }

        /* Ambient effects */
        @keyframes frost-pulse {
            0% { box-shadow: 0 0 2vh rgba(135, 206, 235, 0.4), inset 0 0 1vh rgba(135, 206, 235, 0.2); }
            100% { box-shadow: 0 0 4vh rgba(135, 206, 235, 0.8), inset 0 0 2vh rgba(135, 206, 235, 0.6); }
        }
        .snow-layer {
            position: absolute; top: -10%; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(0.3vh 0.3vh at 10% 10%, #fff, transparent), 
                radial-gradient(0.4vh 0.4vh at 30% 20%, #fff, transparent), 
                radial-gradient(0.2vh 0.2vh at 50% 30%, #fff, transparent),
                radial-gradient(0.5vh 0.5vh at 70% 15%, #fff, transparent),
                radial-gradient(0.3vh 0.3vh at 90% 25%, #fff, transparent);
            background-size: 100% 100%;
            animation: snow-anim 8s linear infinite;
            opacity: 0.5; pointer-events: none; z-index: 1;
        }
        @keyframes snow-anim { 0% { transform: translateY(0); } 100% { transform: translateY(20vh); } }

        .forest-layer {
            position: absolute; bottom: 0; left: 0; right: 0; height: 50%;
            background: radial-gradient(ellipse at bottom, rgba(46, 204, 113, 0.15) 0%, transparent 70%);
            pointer-events: none; z-index: 1;
            animation: breathe-gold 4s alternate infinite;
        }
        @keyframes breathe-gold { 0% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="antialiased text-white flex flex-col h-screen w-screen overflow-hidden bg-[#030508]">

        <div class="flex items-center w-1/4 h-full py-[2vh]">
            <img src="https://lh3.googleusercontent.com/d/1OLed4fFngR-yUPNwI-CRtMVh6EuZ9lC8"

    <!-- NEW LEFT/RIGHT SIDE-BY-SIDE LAYOUT -->

    <footer class="flex-none z-10 h-[6.5vh] bg-gradient-to-b from-[#080C14] to-[#020305] border-t border-[rgba(0,240,255,0.1)] flex items-center overflow-hidden relative shadow-[0_-1vh_2vh_rgba(0,0,0,0.8)]">

        <div class="flex items-center w-full relative z-10 font-mono text-[2vh] uppercase tracking-widest text-white/70">

    <script>
        // Clocks and Tickers
        setInterval(() => {
            const now = new Date();
            try {
                document.getElementById('live-clock').innerText = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                const options = { weekday: 'short', month: 'short', day: 'numeric' };
                document.getElementById('live-date').innerText = now.toLocaleDateString('en-US', options);

                const month = now.toLocaleString('en-US', { month: 'long' }).toUpperCase();
                const year = now.getFullYear();
                const date = now.getDate();
                
                const headerMonth = document.getElementById('header-month');
                if (headerMonth && headerMonth.dataset.month !== month) {
                    headerMonth.innerText = `${month} ${year}`;
                    headerMonth.dataset.month = month;
                }

                let ordinal = "TH";
                if (date > 3 && date < 21) ordinal = "TH";
                else {
                    const lastDigit = date % 10;
                    if(lastDigit === 1) ordinal = "ST";
                    else if(lastDigit === 2) ordinal = "ND";
                    else if(lastDigit === 3) ordinal = "RD";
                }

                const ticker = document.getElementById('footer-ticker');
                if (ticker && ticker.dataset.updatedForDay != date) {
                    const dateStr = `LIVE DATA AS OF ${month} ${date}${ordinal}`;
                    const repeatingText = `
                        <span class="flex items-center gap-[1.5vh]"><span class="text-[#00F0FF]">■</span> ${dateStr}</span>
                        <span class="text-white/30">|</span>
                        <span class="flex items-center gap-[1.5vh] text-[#E2E8F0] tracking-[0.2em] font-bold">MONTH END PROJECTIONS</span>
                        <span class="text-white/30">|</span>
                        <span class="flex items-center gap-[1.5vh] text-[#FFD700] tracking-[0.2em] font-bold">TOP 2 QUALIFY FOR EXCLUSIVE TRIPS</span>
                        <span class="text-white/30">|</span>
                    `;
                    ticker.innerHTML = repeatingText.repeat(8);
                    ticker.dataset.updatedForDay = date; 
                }
            } catch (e) {
                document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
            }
        }, 1000);

        // Hardware TV Force Reload
        const TV_AUTO_RELOAD_MINUTES = 5;
        setTimeout(() => { window.location.reload(); }, TV_AUTO_RELOAD_MINUTES * 60 * 1000);

        function initTvKeepAlive() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                setInterval(() => {
                    if (ctx.state === 'suspended') ctx.resume();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    gain.gain.value = 0.0001;
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                }, 25000);
            } catch (e) { console.log("Audio Heartbeat not supported"); }
        }

        // Data Config
        const SHEET_ID = '1zm49yxiWzi8LCrazWa7VMTNQO0f5qPRmY3Sf0ILVyQw';
        const SHEET_NAME_PHOTOS = 'Employee Photo';
        const SHEET_NAME_SALES = 'Sheet2';
        const REFRESH_INTERVAL_MS = 20000;
        let previousDataHash = "";
        let maxSalesBenchmark = 1; 
        const loader = document.getElementById('loader');

        window.onerror = function(msg, url, line) {
            if(loader) {
                loader.classList.remove('opacity-0', 'hidden');
                loader.innerHTML = `<div style="color:#ff3333; font-family:monospace; text-align:center; padding:4vh; background:#000;">SYS_ERR: ${msg} (Line ${line})</div>`;
            }
        };

        function parseCSV(text) {
            const result = []; let row = []; let inQuotes = false; let currentValue = "";
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    if (inQuotes && text[i+1] === '"') { currentValue += '"'; i++; } 
                    else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) {
                    row.push(currentValue); currentValue = "";
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && text[i+1] === '\n') i++; 
                    row.push(currentValue); result.push(row); row = []; currentValue = "";
                } else { currentValue += char; }
            }
            if (currentValue || row.length > 0) { row.push(currentValue); result.push(row); }
            return result;
        }

        function formatRupees(num) {
            let formatted = "0";
            try { formatted = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 }).format(num); } 
            catch(e) { formatted = Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
            return `<span class="currency-symbol">₹</span>${formatted}`;
        }

        function animateValue(element, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!document.contains(element)) return; 
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 5); 
                const currentVal = Math.floor(easeOut * (end - start) + start);
                element.innerHTML = formatRupees(currentVal);
                if (progress < 1) window.requestAnimationFrame(step);
                else element.innerHTML = formatRupees(end); 
            };
            window.requestAnimationFrame(step);
        }

        function buildTopTierCard(employee, rank) {
            const initial = employee.name.charAt(0).toUpperCase();
            const isRank1 = rank === 1;

            const rankColor = isRank1 ? '#FFD700' : '#2ECC71';
            const glowColor = isRank1 ? 'rgba(255, 215, 0, 0.5)' : 'rgba(46, 204, 113, 0.5)';
            const ambientClass = isRank1 ? 'snow-layer' : 'forest-layer';
            const rankLabel = isRank1 ? '👑 RANK 1' : '🥈 RANK 2';

            const fallbackHTML = `<div class="absolute inset-0 flex items-center justify-center font-sans font-bold text-[8vh]" style="background:linear-gradient(to bottom right, ${rankColor}33, #1A2333); color:${rankColor}80;">${initial}</div>`;
            
            const photoHtml = employee.photo 
                ? `${fallbackHTML}<img src="${employee.photo}" class="avatar-img relative z-10" onerror="this.style.display='none';">`
                : fallbackHTML;

            const tlFirst = employee.tl.split(/\s+/)[0] || 'N/A';
            const rmFirst = employee.rm.split(/\s+/)[0] || 'N/A';
            
            let tagsHtml = "";
            if (employee.tl.toLowerCase() !== employee.name.toLowerCase() && employee.tl.toLowerCase() !== employee.rm.toLowerCase() && tlFirst !== 'N/A') {
                tagsHtml += `<div class="bg-[#05080F]/80 border border-[#00F0FF]/40 px-[1.2vh] py-[0.4vh] rounded-md text-[#00F0FF]/90 tracking-widest text-[1.4vh] shadow-[0_0_1vh_rgba(0,240,255,0.15)] whitespace-nowrap shrink-0"><span class="opacity-60">TL:</span> <span class="text-white ml-[0.3vh] font-bold">${tlFirst}</span></div>`;
            }
            if (rmFirst !== 'N/A') {
                tagsHtml += `<div class="bg-[#05080F]/80 border border-[#00F0FF]/40 px-[1.2vh] py-[0.4vh] rounded-md text-[#00F0FF]/90 tracking-widest text-[1.4vh] shadow-[0_0_1vh_rgba(0,240,255,0.15)] whitespace-nowrap shrink-0"><span class="opacity-60">MGR:</span> <span class="text-white ml-[0.3vh] font-bold">${rmFirst}</span></div>`;
            }

            const routeColor = isRank1 ? '#87CEEB' : '#2ECC71';
            const routeGlow = isRank1 ? 'rgba(135, 206, 235, 0.4)' : 'rgba(46, 204, 113, 0.4)';
            const destination = isRank1 ? 'KASHMIR' : 'WAYANAD';
            
            const planeSvg = `
                <div class="plane-wrapper text-[${routeColor}] flex items-center justify-center w-full h-full drop-shadow-[0_0_0.5vh_currentColor]">
                    <svg viewBox="0 0 24 24" fill="currentColor" class="w-[3vh] h-[3vh] rotate-90">
                        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                    </svg>
                </div>`;
                
            const busSvg = `
                <div class="bus-wrapper text-[${routeColor}] flex items-center justify-center w-full h-full drop-shadow-[0_0_0.5vh_currentColor]">
                    <svg viewBox="0 0 24 24" fill="currentColor" class="w-[3.2vh] h-[3.2vh]">
                        <path d="M17 5H3c-1.1 0-2 .89-2 2v9h2c0 1.65 1.34 3 3 3s3-1.34 3-3h5.5c0 1.65 1.34 3 3 3s3-1.34 3-3H23v-5l-6-6zM3 11V7h4v4H3zm3 6.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm7-6.5H9V7h4v4zm4.5 6.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM15 11V7h1l4 4h-5z"/>
                    </svg>
                </div>`;
            
            const vehicleSvg = isRank1 ? planeSvg : busSvg;

            return `
                <div class="w-full h-full anim-fade-up flex flex-row items-center p-[3vh] relative overflow-hidden gap-[3vh]" style="animation-delay: ${isRank1 ? '0s' : '0.2s'}; border-left: 0.8vh solid ${rankColor}; box-shadow: 0 2vh 4vh rgba(0,0,0,0.8), inset 0 0 4vh ${glowColor.replace('0.5', '0.05')}; background: linear-gradient(90deg, ${glowColor.replace('0.5', '0.15')} 0%, rgba(5, 8, 15, 0.95) 100%); border-radius: 2vh;">
                    
                    <div class="${ambientClass}"></div>

                    <!-- STRICT SIZE Left Avatar Box -->
                    <div class="relative w-[26vh] h-[26vh] shrink-0 z-20 flex items-center justify-center rounded-[3vh] shadow-[0_2vh_4vh_rgba(0,0,0,0.9)] bg-[#030508] border-[0.5vh]" style="border-color: ${rankColor}; box-shadow: 0 0 3vh ${glowColor.replace('0.5', '0.2')};">
                        <div class="w-full h-full rounded-[2.5vh] overflow-hidden bg-[#0A1224] relative">
                            ${photoHtml}
                        </div>
                    </div>

                    <!-- STRICT SIZE Info Container (min-w-0 entirely prevents overlapping text) -->
                    <div class="flex-1 h-full flex flex-col justify-between z-20 min-w-0 py-[0.5vh]">
                        
                        <div class="w-full flex flex-col items-start min-w-0 shrink-0">
                            <div class="font-mono text-[2vh] font-black tracking-widest uppercase mb-[0.2vh] drop-shadow-md shrink-0" style="color: ${rankColor};">${rankLabel}</div>
                            <h2 class="font-sans text-[5vh] text-white font-black uppercase tracking-wide truncate w-full drop-shadow-lg leading-none shrink-0 py-[0.5vh]" title="${employee.name}">
                                ${employee.name}
                            </h2>
                        </div>

                        <!-- Badge & Tracker -->
                        <div class="w-full flex flex-col gap-[1.5vh] shrink-0 my-[1.2vh] min-w-0">
                            <div class="inline-flex w-fit items-center font-mono text-[1.5vh] font-bold tracking-widest px-[1.5vh] py-[0.4vh] rounded-full border shadow-sm shrink-0 truncate" style="color: ${routeColor}; border-color: ${routeColor}; background: ${routeColor}1A; animation: pulse 2s infinite;">
                                ⏳ ABOUT TO WIN ${destination} TRIP
                            </div>
                            
                            <!-- Travel Ping-Pong Container -->
                            <div class="w-full h-[4vh] flex items-center justify-between font-mono text-[1.5vh] font-black tracking-widest bg-[#030508]/80 rounded-full px-[2vh] border relative overflow-hidden shrink-0" style="border-color: ${routeGlow};">
                                <span class="relative z-10 text-[${routeColor}] drop-shadow-md shrink-0">BLR</span>
                                
                                <div class="flex-1 mx-[1.5vh] relative h-full flex items-center justify-center z-10">
                                    <div class="absolute w-full h-[0.2vh] border-b-[0.2vh] border-dashed opacity-30 top-1/2 -translate-y-1/2" style="border-color: ${routeColor};"></div>
                                    <div class="absolute top-1/2 w-[4vh] h-[4vh]" style="animation: travel-pingpong 8s ease-in-out infinite;">
                                        ${vehicleSvg}
                                    </div>
                                </div>
                                
                                <span class="relative z-10 text-[${routeColor}] drop-shadow-md shrink-0">${destination}</span>
                            </div>

                            <!-- Overlap fix: Removing height restriction prevents clip -->
                            <div class="font-mono flex items-center gap-[1vh] w-full shrink-0 flex-wrap overflow-hidden min-h-[3vh]">
                                ${tagsHtml}
                            </div>
                        </div>

                        <!-- Revenue Panel -->
                        <div class="w-full mt-auto bg-[#0A1224]/90 rounded-[1.2vh] border-[0.2vh] py-[1.2vh] px-[2.5vh] flex items-center justify-between relative overflow-hidden shrink-0" style="border-color: ${glowColor.replace('0.5', '0.2')}; box-shadow: inset 0 0 2vh ${glowColor.replace('0.5', '0.1')};">
                            <div class="animate-scan"></div>
                            <span class="font-mono text-[1.8vh] tracking-[0.1em] uppercase font-bold shrink-0" style="color: ${rankColor}; opacity: 0.8;">REVENUE</span>
                            <span class="font-mono text-[5.5vh] text-white font-black drop-shadow-md numeric-counter truncate min-w-0 text-right pl-[1vh] shrink-0" data-target-value="${employee.sales}">
                                <span class="currency-symbol text-white/50">₹</span>0
                            </span>
                        </div>
                        
                    </div>
                </div>
            `;
        }

        // REDESIGNED ROW-BASED LIST CARD for Ranks 3, 4, 5
        function buildListCard(employee, rank) {
            const initial = employee.name.charAt(0).toUpperCase();
            
            let rankColor, glowColor, borderGlow;
            if (rank === 3) { rankColor = "#00F0FF"; glowColor = "rgba(0, 240, 255, 0.7)"; borderGlow = "border-[#00F0FF]/40"; }   
            else if (rank === 4) { rankColor = "#FF8A65"; glowColor = "rgba(255, 138, 101, 0.7)"; borderGlow = "border-[#FF8A65]/40"; }   
            else { rankColor = "#9B59B6"; glowColor = "rgba(155, 89, 182, 0.6)"; borderGlow = "border-[#9B59B6]/30"; }                    

            const fallbackHTML = `<div class="absolute inset-0 flex items-center justify-center font-sans font-bold text-[6vh]" style="background:#0A1224; color:rgba(255,255,255,0.4);">${initial}</div>`;
            
            const photoHtml = employee.photo 
                ? `${fallbackHTML}<img src="${employee.photo}" class="avatar-img relative z-10" onerror="this.style.display='none';">`
                : fallbackHTML;

            const tlFirst = employee.tl.split(/\s+/)[0] || 'N/A';
            const rmFirst = employee.rm.split(/\s+/)[0] || 'N/A';
            
            let listTagsHtml = "";
            if (employee.tl.toLowerCase() !== employee.name.toLowerCase() && employee.tl.toLowerCase() !== employee.rm.toLowerCase() && tlFirst !== 'N/A') {
                listTagsHtml += `<span class="text-white/90 bg-[#00F0FF]/15 border border-[#00F0FF]/30 px-[1.2vh] py-[0.4vh] rounded shadow-sm text-[1.4vh] shrink-0">TL: <span class="text-white font-bold">${tlFirst}</span></span>`;
            }
            if (rmFirst !== 'N/A') {
                listTagsHtml += `<span class="text-white/90 bg-[#00F0FF]/15 border border-[#00F0FF]/30 px-[1.2vh] py-[0.4vh] rounded shadow-sm text-[1.4vh] shrink-0">MGR: <span class="text-white font-bold">${rmFirst}</span></span>`;
            }
                
            const fillPercentage = Math.max(2, (employee.sales / maxSalesBenchmark) * 100);
            let statusMessage = "IN PURSUIT"; let statusIcon = "⚡";

            // Fully row-based to fix wrapping issues in the right column
            return `
                <div class="w-full h-full glass-panel flex flex-row items-center justify-between p-[2.5vh] border-l-[0.8vh] relative overflow-hidden shadow-lg min-h-0 gap-[2vh]" style="animation-delay: ${(rank-1) * 0.1}s; border-left-color: ${rankColor}; border-top: transparent;">
                    
                    <!-- Rank & Avatar (Fixed sizes to prevent squishing) -->
                    <div class="font-mono text-[4.5vh] font-black drop-shadow-md w-[4.5vh] text-center shrink-0" style="color: ${rankColor};">#${rank}</div>
                    
                    <div class="relative w-[15vh] h-[15vh] shrink-0 rounded-[2.5vh] p-[0.4vh] shadow-lg bg-gradient-to-br" style="background: linear-gradient(135deg, ${rankColor}, rgba(255,255,255,0.1));">
                        <div class="w-full h-full bg-[#030508] rounded-[2.1vh] overflow-hidden relative border border-black/50">
                            ${photoHtml}
                        </div>
                    </div>
                    
                    <!-- Details (min-w-0 and truncate ensures text NEVER pushes layout out of bounds) -->
                    <div class="flex flex-col items-start text-left min-w-0 flex-1 justify-center gap-[1vh]">
                        <h3 class="font-sans text-[3.5vh] font-bold text-white leading-none truncate w-full drop-shadow-md py-[0.5vh]" title="${employee.name}">${employee.name}</h3>
                        
                        <!-- Fixed height wrapper removed so tags NEVER hide -->
                        <div class="font-mono flex items-center flex-wrap uppercase gap-[1.2vh] w-full min-h-[3.5vh]">
                            ${listTagsHtml}
                        </div>
                    </div>

                    <!-- Revenue (Fixed width ensures number always stays aligned right) -->
                    <div class="bg-[#050810]/80 border border-white/5 py-[1.5vh] px-[2.5vh] rounded-[1.5vh] flex flex-col items-end justify-center z-10 shrink-0 w-[28vh] min-w-[28vh]">
                        <div class="font-mono text-[4vh] font-bold text-white numeric-counter drop-shadow-md leading-none truncate w-full text-right" data-target-value="${employee.sales}">
                            <span class="currency-symbol text-white/30 text-[2.5vh]">₹</span>0
                        </div>
                        <div class="flex items-center justify-end gap-[0.5vh] mt-[0.8vh] w-full">
                            <span class="animate-pulse text-[1.4vh] grayscale" style="filter: brightness(1.5) sepia(1);">${statusIcon}</span>
                            <span class="font-mono text-[1.4vh] tracking-widest uppercase font-bold truncate text-right shrink-0" style="color: ${rankColor};">${statusMessage}</span>
                        </div>
                    </div>

                    <!-- Market Data Progress Bar -->
                    <div class="absolute bottom-0 left-0 right-0 h-[0.5vh] bg-white/5">
                        <div class="h-full shadow-[0_0_2vh_${glowColor}]" style="width: 0%; background: ${rankColor}; transition: width 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);" data-target-width="${fillPercentage}%"></div>
                    </div>
                </div>
            `;
        }

        async function fetchAndMergeData() {
            const cb = Date.now();
            const photosUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME_PHOTOS)}&z=${cb}`;
            const salesUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME_SALES)}&z=${cb}`;

            try {
                const fetchTimeout = new Promise((_, reject) => setTimeout(() => reject(new Error("Enterprise Network Timeout")), 10000));
                
                const [photosRes, salesRes] = await Promise.race([
                    Promise.all([ fetch(photosUrl), fetch(salesUrl) ]),
                    fetchTimeout
                ]);
                
                if (!photosRes.ok || !salesRes.ok) throw new Error("Secure data access denied.");

                const photosRaw = parseCSV(await photosRes.text());
                const salesRaw = parseCSV(await salesRes.text());

                const exactPhotoMap = new Map();
                const firstNamePhotoMap = new Map();
                
                photosRaw.forEach(row => {
                    if (row.length >= 7) {
                        const fullName = (row[0] || '').trim().toLowerCase();
                        const photoUrl = (row[6] || '').trim();
                        if (fullName && photoUrl) {
                            let cleanUrl = photoUrl;
                            const driveMatch = photoUrl.match(/(?:\/d\/|id=)([\w-]+)/);
                            if (driveMatch && driveMatch[1]) cleanUrl = `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=s1200-c`;
                            exactPhotoMap.set(fullName, cleanUrl);
                            const firstName = fullName.split(/\s+/)[0]; 
                            if (firstName && !firstNamePhotoMap.has(firstName)) firstNamePhotoMap.set(firstName, cleanUrl);
                        }
                    }
                });

                const mergedData = [];
                
                salesRaw.forEach((row) => {
                    const name = (row[0] || '').toString().trim();
                    const rawSalesStr = (row[1] || '').toString().trim(); 
                    const tl = (row[2] || '').toString().trim() || 'N/A'; 
                    const rm = (row[3] || '').toString().trim() || 'N/A'; 

                    let cleanSalesStr = rawSalesStr.replace(/[^0-9.-]+/g, "");
                    const achieved = parseFloat(cleanSalesStr);
                    
                    if (name && !isNaN(achieved) && name.toLowerCase() !== 'employee name') {
                        const searchNameLower = name.toLowerCase();
                        const searchFirstName = searchNameLower.split(/\s+/)[0];
                        const matchedPhoto = exactPhotoMap.get(searchNameLower) || firstNamePhotoMap.get(searchFirstName) || null;
                        mergedData.push({ name, sales: achieved, tl, rm, photo: matchedPhoto });
                    }
                });

                mergedData.sort((a, b) => b.sales - a.sales);
                return mergedData.slice(0, 5);

            } catch (error) {
                console.error("Data Sync Error:", error);
                throw error;
            }
        }

        function renderLeaderboard(data) {
            if (!data || data.length === 0) return;

            const newDataHash = JSON.stringify(data);
            if (newDataHash === previousDataHash) return; 
            previousDataHash = newDataHash;
            
            maxSalesBenchmark = data[0].sales;

            const topTierSlot = document.getElementById('top-tier-slot');
            const contendersSlot = document.getElementById('contenders-slot');

            topTierSlot.innerHTML = ''; 
            contendersSlot.innerHTML = '';

            if (data[0]) topTierSlot.innerHTML += buildTopTierCard(data[0], 1);
            if (data[1]) topTierSlot.innerHTML += buildTopTierCard(data[1], 2);
            
            for (let i = 2; i < 5; i++) {
                if (data[i]) contendersSlot.innerHTML += buildListCard(data[i], i + 1);
            }

            setTimeout(() => {
                document.querySelectorAll('.numeric-counter').forEach(counter => {
                    const targetValue = parseFloat(counter.getAttribute('data-target-value'));
                    animateValue(counter, 0, targetValue, 2000); 
                });

                document.querySelectorAll('.volume-fill').forEach((bar, index) => {
                    setTimeout(() => { bar.style.width = bar.getAttribute('data-target-width'); }, 200 + (index * 150));
                });
            }, 100);

            if (!loader.classList.contains('hidden')) {
                loader.classList.add('opacity-0');
                setTimeout(() => { loader.classList.add('hidden'); }, 700);
            }
        }

        async function updateDashboard() {
            try { renderLeaderboard(await fetchAndMergeData()); } 
            catch (err) { 
                if(loader) {
                    loader.classList.remove('opacity-0', 'hidden');
                    loader.innerHTML = `<div style="color:#00F0FF; font-family:monospace; text-align:center; padding:4vh; background:#030508;">DATA FEED OFFLINE<br>${err.message}</div>`;
                }
            }
        }

        // Display controls and Wakelocks
        let wakeLock = null;
        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } 
            catch (err) { }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateDashboard();
            setInterval(() => { updateDashboard(); }, REFRESH_INTERVAL_MS);
            
            setTimeout(() => {
                requestWakeLock();
                initTvKeepAlive();
                try {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().then(() => {
                            const fsBtn = document.getElementById('fullscreen-btn');
                            if(fsBtn) fsBtn.classList.add('text-[#00F0FF]', 'bg-[#00F0FF]/10');
                        }).catch(() => {});
                    }
                } catch(e) {}
            }, 2500);

            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWakeLock(); });

            document.body.addEventListener('click', () => {
                requestWakeLock();
                initTvKeepAlive();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                    const fsBtn = document.getElementById('fullscreen-btn');
                    if(fsBtn) fsBtn.classList.add('text-[#00F0FF]', 'bg-[#00F0FF]/10');
                }
            });

            const fullscreenBtn = document.getElementById('fullscreen-btn');
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(() => {});
                        fullscreenBtn.classList.add('text-[#00F0FF]', 'bg-[#00F0FF]/10');
                    } else {
                        document.exitFullscreen();
                        fullscreenBtn.classList.remove('text-[#00F0FF]', 'bg-[#00F0FF]/10');
                    }
                });
            }
        });
    </script>
</body>
